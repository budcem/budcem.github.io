  // ---------- Hesabat ----------
  const MON_SHORT = ["Yan", "Fev", "Mar", "Apr", "May", "İyn", "İyl", "Avq", "Sen", "Okt", "Noy", "Dek"];
  const r2 = v => Math.round(v * 100) / 100;
  const cell = v => {
    if (!v) return `<td class="z">–</td>`;
    const t = (Math.round(Math.abs(v) * 100) / 100).toFixed(2).replace(/\.00$/, "").replace(".", ",").replace(/\B(?=(\d{3})+(?!\d))/g, " ");
    return `<td>${v < 0 ? "−" : ""}${t}</td>`;
  };
  function reportData(year) {
    const recs = state.records.filter(r => r.date && r.date.startsWith(year + "-"));
    const months = MONTHS.map((name, i) => ({ name, inc: 0, out: 0, need: 0, want: 0, investment: 0, credit: 0 }));
    const cats = {}, incCats = {};
    recs.forEach(r => {
      const m = Number(r.date.slice(5, 7)) - 1, a = Number(r.amount) || 0;
      const name = catById(r.catId)?.name || "Kateqoriyasız";
      if (r.kind === "cardpay" || r.kind === "transfer") return;
      if (r.kind === "income") {
        months[m].inc += a;
        (incCats[name] ||= Array(12).fill(0))[m] += a;
      } else {
        months[m].out += a;
        if (months[m][r.type] !== undefined) months[m][r.type] += a;
        (cats[name] ||= Array(12).fill(0))[m] += a;
      }
    });
    const rows = obj => Object.entries(obj).map(([name, arr]) => ({ name, arr, total: arr.reduce((x, y) => x + y, 0) })).sort((a, b) => b.total - a.total);
    return { recs, months, cats: rows(cats), incCats: rows(incCats) };
  }

  function openReport() {
    let year = state.month.getFullYear(), view = "months";
    const chevL = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>`;
    const chevR = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>`;
    const pivot = (rows, label) => {
      const totals = Array(12).fill(0);
      rows.forEach(r => r.arr.forEach((v, i) => totals[i] += v));
      return `<div class="tbl-wrap"><table class="tbl">
        <thead><tr><th>${label}</th>${MON_SHORT.map(m => `<th>${m}</th>`).join("")}<th>Cəmi</th></tr></thead>
        <tbody>${rows.map(r => `<tr><td>${esc(r.name)}</td>${r.arr.map(cell).join("")}${cell(r.total)}</tr>`).join("")}
        <tr class="total"><td>Cəmi</td>${totals.map(cell).join("")}${cell(totals.reduce((a, b) => a + b, 0))}</tr></tbody>
      </table></div>`;
    };
    const draw = () => {
      const d = reportData(year);
      let body;
      if (view === "months") {
        const t = d.months.reduce((a, m) => { for (const k of ["inc", "out", "need", "want", "investment", "credit"]) a[k] += m[k]; return a; }, { inc: 0, out: 0, need: 0, want: 0, investment: 0, credit: 0 });
        const row = (name, m, cls = "") => {
          const bal = m.inc - m.out;
          return `<tr class="${cls}"><td>${name}</td>${cell(m.inc)}${cell(m.out)}<td class="${bal < 0 ? "neg" : bal > 0 ? "pos" : "z"}">${bal ? cell(bal).replace(/<\/?td[^>]*>/g, "") : "–"}</td>${cell(m.need)}${cell(m.want)}${cell(m.investment)}${cell(m.credit)}</tr>`;
        };
        body = `<div class="tbl-wrap"><table class="tbl">
          <thead><tr><th>Ay</th><th>Gəlir</th><th>Xərc</th><th>Qalıq</th><th>Ehtiyac</th><th>İstək</th><th>İnvest.</th><th>Kredit</th></tr></thead>
          <tbody>${d.months.map(m => row(m.name, m)).join("")}${row("Cəmi", t, "total")}</tbody>
        </table></div>`;
      } else if (view === "cats") {
        body = d.cats.length ? pivot(d.cats, "Xərc maddəsi") : `<div class="empty"><b>${year} ilində xərc yoxdur</b></div>`;
      } else {
        body = d.incCats.length ? pivot(d.incCats, "Gəlir mənbəyi") : `<div class="empty"><b>${year} ilində gəlir yoxdur</b></div>`;
      }
      sheet(`
        <div class="sheet-head">
          <button class="link" data-close>Bağla</button>
          <h2>Hesabat</h2>
          <span></span>
        </div>
        <div class="stack">
          <div class="cal-head">
            <button class="icon-btn" data-ryear="-1" aria-label="Əvvəlki il">${chevL}</button>
            <b class="num">${year}</b>
            <button class="icon-btn" data-ryear="1" aria-label="Növbəti il">${chevR}</button>
          </div>
          <div class="seg" style="grid-template-columns:1fr 1fr 1fr">
            <button data-rview="months" aria-pressed="${view === "months"}">Aylar</button>
            <button data-rview="cats" aria-pressed="${view === "cats"}">Xərclər</button>
            <button data-rview="inc" aria-pressed="${view === "inc"}">Gəlirlər</button>
          </div>
          ${body}
          <p class="note">Məbləğlər manatla (₼). Cədvəli sağa-sola sürüşdürə bilərsiniz.</p>
          <button class="primary" data-xlsx ${d.recs.length ? "" : "disabled"}>Excel faylı yüklə (${year})</button>
        </div>`);
      // Cari ilin cədvəlində son aylar görünsün
      const w = document.querySelector(".sheet .tbl-wrap");
      if (w && view !== "months" && year === new Date().getFullYear()) w.scrollLeft = w.scrollWidth;
    };
    sheetHandler = e => {
      const t = e.target.closest("button"); if (!t) return;
      if (t.dataset.ryear) { year += Number(t.dataset.ryear); draw(); }
      else if (t.dataset.rview) { view = t.dataset.rview; draw(); }
      else if (t.hasAttribute("data-xlsx")) exportXlsx(year, t);
    };
    draw();
  }

  // Faylı istifadəçiyə vermək: claude.ai daxilində təsdiqlə, ayrıca PWA-da birbaşa yükləmə
  async function saveFile(filename, blob) {
    const dl = window.claude?.use ? await window.claude.use("downloads").catch(() => null) : null;
    if (dl) {
      try { await dl.save({ filename, data: blob }); toast("Fayl hazırdır"); }
      catch (e) { if (e?.code !== "declined") toast("Faylı yükləmək alınmadı."); }
      return;
    }
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  }

  let xlsxPromise = null;
  function loadXlsx() {
    if (window.XLSX) return Promise.resolve(window.XLSX);
    return xlsxPromise ||= new Promise((ok, fail) => {
      const sc = document.createElement("script");
      sc.src = "https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js";
      sc.onload = () => ok(window.XLSX);
      sc.onerror = () => { xlsxPromise = null; fail(new Error("load")); };
      document.head.appendChild(sc);
    });
  }

  async function exportXlsx(year, btn) {
    const label = btn.textContent;
    btn.disabled = true; btn.textContent = "Hazırlanır…";
    try {
      const XLSX = await loadXlsx();
      const d = reportData(year);
      const wb = XLSX.utils.book_new();
      const add = (name, rows, widths) => {
        const ws = XLSX.utils.aoa_to_sheet(rows);
        ws["!cols"] = widths.map(w => ({ wch: w }));
        XLSX.utils.book_append_sheet(wb, ws, name);
      };
      // 1. Aylar
      const mRows = [["Ay", "Gəlir", "Xərc", "Qalıq", "Ehtiyac", "İstək", "İnvestisiya", "Kredit"]];
      const tot = [0, 0, 0, 0, 0, 0, 0];
      d.months.forEach(m => {
        const vals = [m.inc, m.out, m.inc - m.out, m.need, m.want, m.investment, m.credit].map(r2);
        vals.forEach((v, i) => tot[i] += v);
        mRows.push([`${m.name} ${year}`, ...vals]);
      });
      mRows.push(["Cəmi", ...tot.map(r2)]);
      add("Aylar", mRows, [16, 12, 12, 12, 12, 12, 12, 12]);
      // 2. Xərc maddələri və 3. Gəlirlər (pivot)
      const pivotRows = (rows, label) => {
        const out = [[label, ...MONTHS, "Cəmi"]];
        const totals = Array(13).fill(0);
        rows.forEach(r => { const vals = [...r.arr, r.total].map(r2); vals.forEach((v, i) => totals[i] += v); out.push([r.name, ...vals]); });
        out.push(["Cəmi", ...totals.map(r2)]);
        return out;
      };
      add("Xərc maddələri", pivotRows(d.cats, "Xərc maddəsi"), [22, ...Array(13).fill(11)]);
      add("Gəlirlər", pivotRows(d.incCats, "Gəlir mənbəyi"), [22, ...Array(13).fill(11)]);
      // 4. Bütün əməliyyatlar
      const ops = [["Tarix", "Növ", "Başlıq", "Maddə", "Məbləğ", "Qeyd"]];
      d.recs.slice().sort((a, b) => a.date.localeCompare(b.date)).forEach(r => ops.push([
        r.date.split("-").reverse().join("."), r.kind === "income" ? "Gəlir" + (r.acc === "cash" ? " (Nağd)" : "") : r.kind === "transfer" ? `Köçürmə (${accName(r.from)} → ${accName(r.to)})` : r.kind === "cardpay" ? `Karta ödəniş (${cardName(r)})` : r.acc === "cash" ? "Xərc (Nağd)" : isCardExp(r) ? `Xərc (${cardName(r)})` : "Xərc",
        r.kind === "expense" ? (TYPE[r.type]?.title || "") : "", r.kind === "cardpay" || r.kind === "transfer" ? "" : (catById(r.catId)?.name || "Kateqoriyasız") + (r.sub ? ` · ${r.sub}` : ""),
        r2(Number(r.amount) || 0), r.note || ""
      ]));
      add("Əməliyyatlar", ops, [12, 18, 12, 22, 12, 30]);

      const buf = XLSX.write(wb, { bookType: "xlsx", type: "array" });
      const filename = `Budcem-hesabat-${year}.xlsx`;
      const blob = new Blob([buf], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" });
      await saveFile(filename, blob);
    } catch (e) {
      toast("Excel hazırlamaq alınmadı. İnternet bağlantısını yoxlayın.");
    } finally {
      btn.disabled = false; btn.textContent = label;
    }
  }

  // Bir qrupun təsiri: gəlir − balansdan çıxan xərc − karta ödəniş (kartla xərc balansdan çıxmır)
  const netOf = list => sum(list.filter(r => r.kind === "income"))
    - sum(list.filter(r => r.kind === "expense" && !isCardExp(r)))
    - sum(list.filter(r => r.kind === "cardpay"));
  // Hesablar: "bank" (bank kartı; köhnə yazıların hamısı buradadır) və "cash" (nağd).
  // Köçürmə (kind: "transfer", from, to) xərc və ya gəlir deyil, yalnız pulu bir hesabdan digərinə keçirir.
  const ACCS = [{ id: "bank", name: "Bank kartı" }, { id: "cash", name: "Nağd" }];
  const accName = id => ACCS.find(a => a.id === id)?.name || "Bank kartı";
  const accOf = r => r.acc === "cash" ? "cash" : "bank";
  function accDelta(r, acc) {
    const a = Number(r.amount) || 0;
    if (r.kind === "transfer") return (r.to === acc ? a : 0) - (r.from === acc ? a : 0);
    if (accOf(r) !== acc) return 0;
    if (r.kind === "income") return a;
    if (r.kind === "cardpay" || (r.kind === "expense" && !isCardExp(r))) return -a;
    return 0;
  }
  const accBalance = (acc, until) => state.records.reduce((t, r) => r.date && r.date <= until ? t + accDelta(r, acc) : t, 0);
  // Seçilmiş aydan əvvəlki bütün aylardan qalan qalıq
  function carryIn() {
    const start = ymd(new Date(state.month.getFullYear(), state.month.getMonth(), 1));
    return netOf(state.records.filter(r => r.date && r.date < start));
  }

  // Plan limitlərinə (başlıq və maddə) cari ay üzrə yaxınlaşma və aşılma xəbərdarlığı
  function limitAlerts() {
    const exp = monthRecords().filter(r => r.kind === "expense");
    const P = state.plan;
    const out = [];
    const check = (name, v, p) => { if (p > 0 && v >= p * 0.8) out.push({ name, v, p }); };
    TYPES.forEach(t => check(t.title, sum(exp.filter(r => r.type === t.id)), Number(P.types[t.id]) || 0));
    state.categories.filter(c => c.kind === "expense").forEach(c => check(c.name, sum(exp.filter(r => r.catId === c.id)), Number(P.cats[c.id]) || 0));
    return out.sort((a, b) => b.v / b.p - a.v / a.p);
  }
  function limitAlertsHtml() {
    const al = limitAlerts();
    if (!al.length) return "";
    return `<section class="card limit-alerts">
      <p class="label">Limit xəbərdarlığı · ${MONTHS[state.month.getMonth()]}</p>
      ${al.map(a => `<div class="la ${a.v > a.p ? "over" : ""}"><span>${esc(a.name)}</span><span class="num">${money(a.v)} / ${money(a.p)} · ${a.v > a.p ? `${money(a.v - a.p)} aşılıb` : `${Math.round(a.v / a.p * 100)}%`}</span></div>`).join("")}
    </section>`;
  }

  function summaryView() {
    const list = monthRecords();
    const exp = list.filter(r => r.kind === "expense");
    const inc = sum(list.filter(r => r.kind === "income"));
    const out = sum(exp);
    // Kartla xərc xərcdir, amma öz balansından çıxmır; karta ödəniş isə balansdan çıxır
    const cardPaid = sum(list.filter(r => r.kind === "cardpay"));
    const bal = carryIn() + netOf(list);

    // Xərc başlıqları və maddələri seçilmiş dövr üzrə; Qalıq kartı isə həmişə ay üzrə
    const m = state.month.getMonth();
    const period = state.sumPeriod;
    const periodRecs = period === "all" ? state.records
      : period === "range" ? state.records.filter(r => r.date && (!state.sumFrom || r.date >= state.sumFrom) && (!state.sumTo || r.date <= state.sumTo))
      : list;
    const pexp = periodRecs.filter(r => r.kind === "expense");
    const pout = sum(pexp);
    const fmtD = d => d ? d.split("-").reverse().join(".") : "…";
    const periodLabel = period === "all" ? "bütün zamanlar" : period === "range" ? `${fmtD(state.sumFrom)} – ${fmtD(state.sumTo)}` : `${MONTHS[m]} ${state.month.getFullYear()}`;

    const byType = TYPES.map(t => ({ ...t, total: sum(pexp.filter(r => r.type === t.id)) }));
    // Donut: hər başlıq üçün bir qövs
    const R = 52, C = 2 * Math.PI * R;
    let off = 0;
    const arcs = pout > 0 ? byType.filter(t => t.total > 0).map(t => {
      const len = t.total / pout * C;
      const gap = byType.filter(x => x.total > 0).length > 1 ? 2 : 0;
      const s = `<circle cx="66" cy="66" r="${R}" fill="none" stroke="${t.color}" stroke-width="16" stroke-dasharray="${Math.max(len - gap, 0.5)} ${C}" stroke-dashoffset="${-off}" transform="rotate(-90 66 66)"/>`;
      off += len; return s;
    }).join("") : `<circle cx="66" cy="66" r="${R}" fill="none" stroke="var(--surface-2)" stroke-width="16"/>`;

    const groups = {}, subs = {};
    pexp.forEach(r => {
      const n = catById(r.catId)?.name || "Kateqoriyasız"; groups[n] = (groups[n] || 0) + Number(r.amount);
      if (r.sub) { const g = subs[n] ||= {}; g[r.sub] = (g[r.sub] || 0) + Number(r.amount); }
    });
    const cats = Object.entries(groups).sort((a, b) => b[1] - a[1]);
    const max = cats[0]?.[1] || 1;

    return `
      <section class="card balance">
        <p class="label">Qalıq</p>
        <div class="big num ${bal < 0 ? "neg" : ""}">${money(bal)}</div>
        <div class="split">
          <div class="in"><small>Gəlir</small><b class="num">${money(inc)}</b></div>
          <div class="out"><small>Xərc</small><b class="num">${money(out)}</b></div>
        </div>
        <div class="accs">
          ${ACCS.map(a => { const v = accBalance(a.id, ymd(new Date(state.month.getFullYear(), state.month.getMonth() + 1, 0))); return `<div class="acc"><small>${a.name}</small><b class="num ${v < 0 ? "neg" : ""}">${money(v)}</b></div>`; }).join("")}
          <button class="xfer" data-transfer aria-label="Hesablar arası köçürmə">⇄ Köçürmə</button>
        </div>
      </section>
      ${newsCard()}
      ${localMergeNag()}
      ${backupNag()}
      ${limitAlertsHtml()}
      ${toolTiles()}
      <section class="card">
        <div class="seg three" role="group" aria-label="Hesabat dövrü">
          <button data-period="month" aria-pressed="${period === "month"}">${MONTHS[m]}</button>
          <button data-period="all" aria-pressed="${period === "all"}">Hamısı</button>
          <button data-period="range" aria-pressed="${period === "range"}">Tarix aralığı</button>
        </div>
        ${period === "range" ? `<div class="range-row">
          <label>Başlanğıc<input class="input" type="date" data-rangefrom value="${esc(state.sumFrom)}"></label>
          <label>Son<input class="input" type="date" data-rangeto value="${esc(state.sumTo)}"></label>
        </div>` : ""}
      </section>
      <section class="card">
        <p class="label">Xərc başlıqları · ${esc(periodLabel)}</p>
        <div class="donut-row">
          <svg class="donut" viewBox="0 0 132 132" role="img" aria-label="Xərc başlıqları üzrə bölgü">
            ${arcs}
            <text x="66" y="62" text-anchor="middle" font-size="11" opacity=".6">Cəmi</text>
            <text x="66" y="80" text-anchor="middle" font-size="15" font-weight="700" class="num">${esc(money(pout))}</text>
          </svg>
          <div class="legend">
            ${byType.map(t => `
              <div class="legend-item">
                <span class="dot" style="background:${t.color}"></span>
                <span>${t.title}</span>
                <span class="num">${money(t.total)}<span class="pct">${pout > 0 ? Math.round(t.total / pout * 100) : 0}%</span></span>
              </div>`).join("")}
          </div>
        </div>
      </section>
      <section class="card">
        <button class="card-toggle" data-togglesum aria-expanded="${state.catsOpen}">
          <p class="label">Xərc maddələri üzrə${cats.length ? ` · ${cats.length}` : ""}</p><span class="chev">›</span>
        </button>
        ${!state.catsOpen ? "" : cats.length ? `<div class="bars">${cats.map(([n, v]) => `
          <div class="bar-row">
            ${badge(n)}
            <div class="name">${esc(n)}<div class="track"><i style="width:${(v / max * 100).toFixed(1)}%"></i></div>${subs[n] ? `<div class="subsplit">${[...Object.entries(subs[n]), ...(v - Object.values(subs[n]).reduce((a, x) => a + x, 0) > 0.004 ? [["Seçilməmiş", v - Object.values(subs[n]).reduce((a, x) => a + x, 0)]] : [])].map(([k, x]) => `${esc(k)} ${money(x)}`).join(" · ")}</div>` : ""}</div>
            <span class="num">${money(v)}</span>
          </div>`).join("")}</div>`
        : `<div class="empty" style="padding:16px"><b>Bu dövrdə xərc yoxdur</b>Başqa dövr seçin və ya + düyməsi ilə xərc əlavə edin.</div>`}
      </section>
      ${monthsHtml()}
      ${store.mode === "local" ? `<p class="note">Məlumatlar bu cihazın brauzerində saxlanılır.</p>` : ""}`;
  }

  // Bütün ayların tarixçəsi: köhnə aylar silinmir, istənilən aya qayıtmaq olar
  function monthsHtml() {
    const byMonth = {};
    state.records.forEach(r => {
      if (!r.date) return;
      const k = r.date.slice(0, 7);
      const m = byMonth[k] ||= { inc: 0, out: 0 };
      if (r.kind === "income") m.inc += Number(r.amount) || 0; else if (r.kind === "expense") m.out += Number(r.amount) || 0;
    });
    const keys = Object.keys(byMonth).sort().reverse();
    if (!keys.length) return "";
    const cur = monthKey(state.month);
    return `<section class="months">
      <p class="label" style="margin-left:4px">Aylar üzrə tarixçə</p>
      <div class="list">${keys.map(k => {
        const [y, m] = k.split("-").map(Number), v = byMonth[k], bal = v.inc - v.out;
        return `<button class="row" data-month="${k}" aria-current="${k === cur}">
          <span class="badge" style="background:var(--accent);color:var(--accent-fg);font-size:12px">${pad(m)}</span>
          <span class="t"><div>${MONTHS[m - 1]} ${y}</div><div class="sub num">Gəlir ${money(v.inc)} · Xərc ${money(v.out)}</div></span>
          <span class="amt num ${bal < 0 ? "bal-neg" : ""}">${money(bal)}</span>
        </button>`;
      }).join("")}</div>
    </section>`;
  }

  // ---------- Xərc planı ----------
  // Plan hər ay üçün eynidir: gözlənilən gəlir, 4 başlıq üzrə limit və istəyə bağlı maddə limitləri
  function planView() {
    const list = monthRecords();
    const exp = list.filter(r => r.kind === "expense");
    const inc = sum(list.filter(r => r.kind === "income"));
    const out = sum(exp);
    const P = state.plan;
    const planOut = TYPES.reduce((a, t) => a + (Number(P.types[t.id]) || 0), 0);
    const left = planOut - out;
    const pct = (v, p) => p > 0 ? Math.min(v / p * 100, 100).toFixed(1) : 0;
    const msg = (v, p) => !p ? `<div class="msg">Limit qoyulmayıb</div>` : v > p
      ? `<div class="msg over">Limit ${money(v - p)} aşılıb</div>`
      : `<div class="msg">Qalan: ${money(p - v)} · ${Math.round(v / p * 100)}%</div>`;
    const row = (attr, icon, name, v, p) => `
      <button class="plan-row" ${attr}>
        ${icon}
        <div>
          <div class="top"><span>${esc(name)}</span><span class="num">${money(v)} <span class="muted">/ ${p ? money(p) : "–"}</span></span></div>
          <div class="prog ${p && v > p ? "over" : ""}"><i style="width:${p ? pct(v, p) : 0}%"></i></div>
          ${msg(v, p)}
        </div>
      </button>`;

    const catSpent = {};
    exp.forEach(r => { if (r.catId) catSpent[r.catId] = (catSpent[r.catId] || 0) + (Number(r.amount) || 0); });
    const expCats = state.categories.filter(c => c.kind === "expense");
    const active = expCats.filter(c => P.cats[c.id] || catSpent[c.id])
      .sort((a, b) => (Number(P.cats[b.id]) || 0) - (Number(P.cats[a.id]) || 0) || (catSpent[b.id] || 0) - (catSpent[a.id] || 0));
    const rest = expCats.filter(c => !active.includes(c));

    return `
      <section class="card">
        <p class="label">${MONTHS[state.month.getMonth()]} planı</p>
        <div class="plan-top">
          <button data-planedit="income"><small>Gəlir planı</small><b class="num">${P.income ? money(P.income) : "Yazın"}</b></button>
          <div><small>Plan xərc</small><b class="num">${money(planOut)}</b></div>
          <div><small>Qənaət planı</small><b class="num ${P.income - planOut < 0 ? "bal-neg" : ""}">${P.income ? money(P.income - planOut) : "–"}</b></div>
        </div>
        <div class="plan-big">
          <b class="num ${planOut && out > planOut ? "bal-neg" : ""}">${money(out)}</b>
          <span class="num">${planOut ? `${money(planOut)} plandan` : "xərclənib"}</span>
        </div>
        <div class="prog ${planOut && out > planOut ? "over" : ""}"><i style="width:${pct(out, planOut)}%"></i></div>
        <p class="note" style="text-align:left;margin:8px 0 0">${!planOut ? "Aşağıda başlıqlara toxunub aylıq limit yazın." : left >= 0 ? `Bu ay hələ ${money(left)} xərcləyə bilərsiniz.` : `Plan ${money(-left)} aşılıb.`}${P.income ? ` Faktiki gəlir: ${money(inc)}.` : ""}</p>
      </section>
      <section class="card" style="padding-block:10px 6px">
        <p class="label" style="margin-top:6px">Başlıqlar üzrə limit</p>
        ${TYPES.map(t => row(`data-planedit="type:${t.id}"`, `<span class="type-ic" style="background:color-mix(in srgb, ${t.color} 15%, transparent)"><i style="background:${t.color}"></i></span>`,
          t.title, sum(exp.filter(r => r.type === t.id)), Number(P.types[t.id]) || 0)).join("")}
      </section>
      <section class="card" style="padding-block:10px 6px">
        <p class="label" style="margin-top:6px">Xərc maddələri üzrə limit</p>
        ${active.map(c => row(`data-planedit="cat:${esc(c.id)}"`, badge(c.name), c.name, catSpent[c.id] || 0, Number(P.cats[c.id]) || 0)).join("")
          || `<p class="note" style="text-align:left;margin:4px 0 10px">İstəsəniz, ayrı-ayrı maddələrə də limit qoya bilərsiniz (məs. Restoran 150 ₼).</p>`}
        ${rest.length ? `<button class="card-toggle" data-planall aria-expanded="${state.planShowAll}" style="padding:10px 0;border-top:1px solid var(--line)">
            <span class="small-link">${state.planShowAll ? "Gizlət" : `Digər maddələr (${rest.length})`}</span><span class="chev">›</span></button>
          ${state.planShowAll ? rest.map(c => row(`data-planedit="cat:${esc(c.id)}"`, badge(c.name), c.name, 0, 0)).join("") : ""}` : ""}
      </section>
      <p class="note">Plan hər ay üçün eynidir. Başlıqların cəmi aylıq ümumi xərc planıdır, maddə limitləri isə əlavə nəzarət üçündür.</p>`;
  }

  function openPlanEdit(target) {
    const P = state.plan;
    let title, current;
    if (target === "income") { title = "Gözlənilən aylıq gəlir"; current = P.income; }
    else if (target.startsWith("type:")) { const t = TYPE[target.slice(5)]; title = `${t.title} limiti`; current = P.types[t.id]; }
    else { const c = catById(target.slice(4)); if (!c) return; title = `${c.name} limiti`; current = P.cats[c.id]; }
    let text = current ? String(current).replace(".", ",") : "";
    sheet(`
      <div class="sheet-head">
        <button class="link" data-close>Ləğv et</button>
        <h2>${esc(title)}</h2>
        <button class="link save" data-save>Saxla</button>
      </div>
      <div class="stack">
        <label class="amount-wrap"><input id="p-amount" class="num" inputmode="decimal" placeholder="0" value="${esc(text)}" autocomplete="off"><em>₼</em></label>
        <p class="note">${target === "income" ? "Hər ay təxminən nə qədər gəlir gözləyirsiniz?" : "Bu məbləğ hər ay üçün limit olacaq. Boş saxlasanız, limit götürülür."}</p>
        ${current ? `<button class="secondary" data-clear>Limiti götür</button>` : ""}
      </div>`);
    const inp = $("#p-amount");
    inp.addEventListener("input", () => { text = inp.value; });
    setTimeout(() => inp.focus(), 50);
    const apply = v => {
      const np = normPlan(state.plan);
      if (target === "income") np.income = v;
      else if (target.startsWith("type:")) { if (v) np.types[target.slice(5)] = v; else delete np.types[target.slice(5)]; }
      else { if (v) np.cats[target.slice(4)] = v; else delete np.cats[target.slice(4)]; }
      state.plan = np; store.saveMeta(); closeSheet(); toast("Plan yeniləndi");
    };
    sheetHandler = e => {
      const t = e.target.closest("button"); if (!t) return;
      if (t.hasAttribute("data-save")) { const v = parseFloat(text.replace(",", ".")); apply(v > 0 ? Math.round(v * 100) / 100 : 0); }
      else if (t.hasAttribute("data-clear")) apply(0);
    };
  }

  function recordsView() {
    let list = monthRecords();
    if (state.filter !== "all") list = list.filter(r => r.kind === state.filter);
    const days = {};
    list.forEach(r => (days[r.date] ||= []).push(r));
    const keys = Object.keys(days).sort().reverse();
    const chips = [["all", "Hamısı"], ["expense", "Xərc"], ["income", "Gəlir"]]
      .map(([k, t]) => `<button class="chip" data-filter="${k}" aria-pressed="${state.filter === k}">${t}</button>`).join("");
    if (!keys.length) return `<div class="chips">${chips}</div><div class="empty"><b>Əməliyyat yoxdur</b>Bu ay üçün hələ heç nə qeyd edilməyib. + düyməsinə toxunun.</div>`;
    return `<div class="chips">${chips}</div>` + keys.map(k => {
      const items = days[k].slice().sort((a, b) => (b.created || 0) - (a.created || 0));
      const net = sum(items.filter(r => r.kind === "income")) - sum(items.filter(r => r.kind === "expense"));
      return `<section class="day" id="d-${k}"><h3><span>${dayTitle(k)}</span><span class="num">${money(net)}</span></h3>
        <div class="list">${items.map(swipeRow).join("")}</div></section>`;
    }).join("");
  }

  function swipeRow(r) {
    return `<div class="swipe">
      <button class="swipe-del" data-delrec="${esc(r.id)}" aria-label="Sil"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9 7V4.5h6V7M6.5 7l1 13h9l1-13M10 11v5.5M14 11v5.5"/></svg></button>
      ${rowHtml(r)}
    </div>`;
  }

  function rowHtml(r) {
    if (r.kind === "transfer") return `<button class="row" data-edit="${esc(r.id)}">
      <span class="badge" style="background:var(--surface-2);color:var(--accent)">⇄</span>
      <span class="t"><div>Köçürmə</div><div class="sub">${[`${accName(r.from)} → ${accName(r.to)}`, r.note].filter(Boolean).map(esc).join(" · ")}</div></span>
      <span class="amt num muted">${money(Number(r.amount))}</span>
    </button>`;
    if (r.kind === "cardpay") return `<button class="row" data-edit="${esc(r.id)}">
      ${badge(cardName(r))}
      <span class="t"><div>Karta ödəniş</div><div class="sub">${[cardName(r), r.acc === "cash" ? "Nağddan" : "", "Xərc deyil", r.note].filter(Boolean).map(esc).join(" · ")}</div></span>
      <span class="amt num muted">${money(Number(r.amount))}</span>
    </button>`;
    const c = catById(r.catId);
    const name = c?.name || "Kateqoriyasız";
    const fx = r.cur && r.cur !== "AZN" ? `${plainNum(Number(r.orig))} ${CUR_SYM[r.cur] || r.cur} (kurs ${plainNum(Number(r.rate))})` : "";
    const sub = [r.sub, r.kind === "income" ? "Gəlir" : TYPE[r.type]?.title, isCardExp(r) ? cardName(r) : r.acc === "cash" ? "Nağd" : "", fx, r.note].filter(Boolean).map(esc).join(" · ");
    return `<button class="row" data-edit="${esc(r.id)}">
      ${badge(name)}
      <span class="t"><div>${esc(name)}</div><div class="sub">${sub}</div></span>
      <span class="amt num ${r.kind === "income" ? "in" : ""}">${r.kind === "income" ? "+" : "−"}${money(Number(r.amount))}</span>
    </button>`;
  }

  function catsView() {
    const list = state.categories.filter(c => c.kind === state.catKind);
    const counts = {};
    state.records.forEach(r => counts[r.catId] = (counts[r.catId] || 0) + 1);
    return `
      <div class="seg">
        <button data-catkind="expense" aria-pressed="${state.catKind === "expense"}">Xərc maddələri</button>
        <button data-catkind="income" aria-pressed="${state.catKind === "income"}">Gəlir mənbələri</button>
      </div>
      <div class="list">${list.map(c => `
        <button class="row" data-cat="${esc(c.id)}">
          ${badge(c.name)}
          <span class="t"><div>${esc(c.name)}</div><div class="sub">${counts[c.id] ? counts[c.id] + " əməliyyat" : "Hələ istifadə olunmayıb"}</div></span>
          <span class="chev">›</span>
        </button>`).join("") || `<div class="empty">Siyahı boşdur.</div>`}
      </div>
      <button class="primary" data-newcat>+ Yeni ${state.catKind === "expense" ? "xərc maddəsi" : "gəlir mənbəyi"}</button>`;
  }

  // ---------- Ayarlar (yuxarıdakı dişli ikonu) ----------
  function openSettings() {
    sheet(`
      <div class="sheet-head">
        <button class="link" data-close>Bağla</button>
        <h2>Ayarlar</h2>
        <span></span>
      </div>
      <div class="stack">
      <section class="card profile">
        <button class="avatar big" data-photo aria-label="Profil şəklini dəyiş">${avatarInner(true)}<span class="cam">✎</span></button>
        <label class="field" style="flex:1;min-width:0"><span>Adınız</span><input id="pf-name" class="input" maxlength="40" placeholder="Məsələn: Elşən" value="${esc(state.profile.name || "")}"></label>
        <input type="file" id="photoFile" accept="image/*" hidden>
      </section>
      ${state.profile.photo ? `<button class="link" style="justify-self:center" data-delphoto>Şəkli sil</button>` : ""}
      <section class="card acct">
        <button class="secondary" id="shakeBtn" style="width:100%">${shakeLabel()}</button>
      </section>
      <section class="card acct">
        <span style="flex:1">Tünd rejim</span>
        <button class="switch" id="themeBtn" role="switch" aria-checked="${isDark()}" aria-label="Tünd rejim"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button>
      </section>
      ${store.cloud && store.user ? `
      <section class="card" >
        <p class="label">Hesab</p>
        <div class="acct"><span class="sub">Giriş:</span><b>${esc(displayName(store.user.email))}</b></div>

        <button class="secondary" style="margin-top:10px;width:100%" data-changepass>Şifrəni dəyiş</button>

  function loadImage(file) {
    return new Promise((ok, no) => {
      const img = new Image(), url = URL.createObjectURL(file);
      img.onload = () => { URL.revokeObjectURL(url); ok(img); };

      img.src = url;
    });
  }
  // Profil şəklini kəsmək: barmaqla sürüşdürüb yerləşdirmək, sürüşkənlə böyütmək/kiçiltmək.
  // Nəticə 160×160 JPEG (~10 KB) olur və məlumatla birlikdə (şifrəli) saxlanılır.
  function openCropper(img) {
    const V = 260, W = img.naturalWidth, H = img.naturalHeight;
    const base = V / Math.min(W, H);            // dairəni tam dolduran ən kiçik ölçü
    let zoom = 1, x = 0, y = 0;                 // x, y: şəklin mərkəzinin dairə mərkəzindən sürüşməsi (px)
    const clamp = () => {
      const k = base * zoom, mx = Math.max(0, (W * k - V) / 2), my = Math.max(0, (H * k - V) / 2);
      x = Math.min(mx, Math.max(-mx, x)); y = Math.min(my, Math.max(-my, y));
    };
    const paint = (ctx, size) => {
      const k = base * zoom * size / V;
      ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, size, size);
      ctx.drawImage(img, size / 2 + x * size / V - W * k / 2, size / 2 + y * size / V - H * k / 2, W * k, H * k);
    };
    sheet(`
      <div class="sheet-head">
        <button class="link" data-cropcancel>Ləğv et</button>
        <h2>Şəkli yerləşdir</h2>
        <button class="link save" data-cropsave>Saxla</button>
      </div>
      <div class="stack" style="align-items:center">
        <div class="crop"><canvas id="cropC" width="${V * 2}" height="${V * 2}"></canvas></div>
        <label class="field" style="width:100%;max-width:300px"><span>Ölçü</span>
          <div class="zoom"><span>−</span><input id="cropZ" type="range" min="1" max="4" step="0.01" value="1" aria-label="Şəklin ölçüsü"><span>+</span></div></label>
        <p class="note">Şəkli barmaqla sürüşdürüb dairənin içində yerləşdirin.</p>
      </div>`);
    const c = $("#cropC"), ctx = c.getContext("2d");
    const draw = () => { clamp(); paint(ctx, V * 2); };
    draw();
    $("#cropZ").addEventListener("input", e => { zoom = Number(e.target.value); draw(); });
    let drag = null;
    c.addEventListener("pointerdown", e => { drag = { px: e.clientX, py: e.clientY, x, y }; c.setPointerCapture(e.pointerId); });
    c.addEventListener("pointermove", e => { if (!drag) return; x = drag.x + e.clientX - drag.px; y = drag.y + e.clientY - drag.py; draw(); });
    const end = () => { drag = null; };
    c.addEventListener("pointerup", end); c.addEventListener("pointercancel", end);
    c.addEventListener("wheel", e => { e.preventDefault(); zoom = Math.min(4, Math.max(1, zoom * (e.deltaY < 0 ? 1.08 : 0.93))); $("#cropZ").value = zoom; draw(); }, { passive: false });
    sheetHandler = async e => {
      const b = e.target.closest("button"); if (!b) return;
      if (b.hasAttribute("data-cropcancel")) return openSettings();
      if (!b.hasAttribute("data-cropsave")) return;
      const out = document.createElement("canvas"); out.width = out.height = 160;
      paint(out.getContext("2d"), 160);
      state.profile = { ...state.profile, photo: out.toDataURL("image/jpeg", 0.85) };
      await store.saveMeta(); openSettings(); paintAvatar();
    };
  }

  const GEAR_SVG = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>`;
  const PERSON_SVG = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>`;
  const avatarInner = big => state.profile.photo ? `<img src="${esc(state.profile.photo)}" alt="">` : initials() ? `<b>${esc(initials())}</b>` : big ? PERSON_SVG : GEAR_SVG;
  // Yuxarıdakı ayarlar düyməsi: profil şəkli, yoxdursa adın baş hərfləri, o da yoxdursa dişli
  // Yuxarıdakı düymə: profil şəkli varsa şəkil, yoxdursa dişli ikonu
  function paintAvatar() {

  async function settingsAction(b) {

  // Rəy və təkliflər: Firestore "feedback" kolleksiyasına yazılır (yalnız əlavə etmək olar, oxumaq yox).
  // Bu mesaj şifrələnmir, çünki onu tətbiqin sahibi Firebase konsolunda oxuyur.
  function openFeedback() {
    const f = { kind: "Təklif", text: "", msg: "", list: null };

    const fmtDate = ts => { const d = ts?.toDate ? ts.toDate() : null; return d ? `${d.getDate()} ${MON_SHORT[d.getMonth()]} ${d.getFullYear()}` : ""; };

              <div class="fb-text">${esc(x.text || "")}</div>

            </div>`).join("")}</div>`;
    const draw = () => {
      sheet(`
        <div class="sheet-head">
          <button class="link" data-back>‹ Geri</button>
          <h2>Bizə müraciət edin</h2>
          <button class="link save" data-send ${f.text.trim().length >= 3 ? "" : "disabled"}>Göndər</button>
        </div>
        <div class="stack">
          <div class="seg three">${KINDS.map(k => `<button data-fkind="${k}" aria-pressed="${f.kind === k}">${k}</button>`).join("")}</div>
          <label class="field"><span>Mesajınız</span><textarea id="fb-text" class="input" rows="6" maxlength="1500" placeholder="Nəyi bəyəndiniz, nə çatışmır, nə əlavə edək?">${esc(f.text)}</textarea></label>
          ${f.msg ? `<p class="note" style="text-align:left;color:var(--expense)">${esc(f.msg)}</p>` : ""}
          <p class="note">Mesajı tətbiqin sahibi oxuyacaq. Cavab verə bilməsi üçün hesabınızın adı (${esc(displayName(store.user?.email || ""))}) da göndərilir. Xərc və gəlirləriniz göndərilmir. Cavab gələndə burada, "Müraciətlərim" altında görünəcək.</p>
          <div id="fb-mine">${listHtml()}</div>
        </div>`);
      const ta = $("#fb-text");
      ta.addEventListener("input", e => { f.text = e.target.value; $("[data-send]").disabled = f.text.trim().length < 3; });
    };
    sheetHandler = async e => {
      const t = e.target.closest("button"); if (!t) return;
      if (t.hasAttribute("data-back")) return openSettings();
      if (t.dataset.fkind) { f.kind = t.dataset.fkind; return draw(); }
      if (!t.hasAttribute("data-send") || f.text.trim().length < 3) return;
      t.disabled = true;
      try {
        await store.fb.fs.collection("feedback").add({
          kind: f.kind, text: f.text.trim().slice(0, 1500), uid: store.user.uid,
          user: displayName(store.user.email), name: state.profile.name || "",
          created: firebase.firestore.FieldValue.serverTimestamp(), ua: navigator.userAgent.slice(0, 200)
        });
        f.text = ""; f.msg = ""; f.list = null; draw(); loadMine(); toast("Təşəkkürlər! Mesajınız göndərildi");
      } catch (err) { t.disabled = false; f.msg = err?.code === "permission-denied" ? "Göndərmək hələ mümkün deyil (server ayarı tamamlanmayıb). Bir az sonra yenidən yoxlayın." : "Göndərmək alınmadı. İnternet bağlantısını yoxlayın."; draw(); }
    };
    const loadMine = async () => {
      f.list = await myFeedback();
      const box = $("#fb-mine"); if (box) box.innerHTML = listHtml();
      markRepliesSeen(f.list);
    };
    draw(); loadMine();
  }
  // İstifadəçinin öz müraciətləri (cavablar admin tərəfindən konsolda "reply" sahəsinə yazılır)
  async function myFeedback() {
    try {
      const q = await store.fb.fs.collection("feedback").where("uid", "==", store.user.uid).get();
      return q.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => (b.created?.seconds || 0) - (a.created?.seconds || 0));
    } catch (e) { return []; }
  }
  const SEEN_KEY = "budcem.seenReplies";
  let unreadReplies = 0;
  function markRepliesSeen(list) {
    try { localStorage.setItem(SEEN_KEY, JSON.stringify(list.filter(x => x.reply).map(x => x.id + ":" + x.reply.length))); } catch (e) {}
    unreadReplies = 0; paintBell();
  }
  // Oxunmamış cavab varsa: yuxarıdakı ayarlar düyməsində və "Bizə müraciət edin" düyməsində qırmızı zəng
  function paintBell() {
    const b = $("#settingsBtn"); if (!b) return;
    let dot = b.querySelector(".bell"); if (!dot) { b.insertAdjacentHTML("beforeend", `<span class="bell" hidden>${BELL_SVG}</span>`); dot = b.querySelector(".bell"); }
    dot.hidden = !unreadReplies;
    b.setAttribute("aria-label", unreadReplies ? "Ayarlar, yeni cavab var" : "Ayarlar");
  }
  // Tətbiq açılanda bir dəfə: yeni cavab varsa xəbər verilir
  async function checkReplies() {
    const list = await myFeedback();
    let seen = [];
    try { seen = JSON.parse(localStorage.getItem(SEEN_KEY) || "[]"); } catch (e) {}
    unreadReplies = list.filter(x => x.reply && !seen.includes(x.id + ":" + x.reply.length)).length;
    paintBell();
  }
  // Şifrəni dəyişmək: köhnə şifrə ilə təsdiq, sonra məlumatın açarı yeni şifrə ilə bağlanır

  }

        const p = $("#f-prev"); if (p) p.textContent = "Manatla: " + (v > 0 ? money(v) : "—");
      };
      a.addEventListener("input", () => { if (curOf(f)) f.orig = a.value; else f.amount = a.value; refresh(); });
      const rateInp = $("#f-rate");
      if (rateInp) rateInp.addEventListener("input", () => { f.rate = rateInp.value; refresh(); });
      $("#f-date").addEventListener("change", e => { f.date = e.target.value; });
      $("#f-note").addEventListener("input", e => { f.note = e.target.value; });
      if (first && !editing && !f.amount) setTimeout(() => a.focus(), 50);
      first = false;
    };

    sheetHandler = e => {
      const t = e.target.closest("button");
      if (!t) return;
      if (t.dataset.kind) { f.kind = t.dataset.kind; f.catId = null; catOpen = false; draw(); }
      else if (t.hasAttribute("data-togglecats")) openPicker(f.kind === "expense" ? "Xərc maddəsi" : "Gəlir mənbəyi", state.categories.filter(c => c.kind === f.kind), f.catId, id => { f.catId = id; if (!isUtil(catById(id))) delete f.sub; draw(); });
      else if (t.dataset.type) { f.type = t.dataset.type; draw(); }
      else if (t.dataset.pay) { if (t.dataset.pay === "card") f.pay = "card"; else { delete f.pay; f.acc = t.dataset.pay === "cash" ? "cash" : undefined; } draw(); }
      else if (t.dataset.paycard) { f.cardId = t.dataset.paycard; draw(); }
      else if (t.dataset.sub) { f.sub = f.sub === t.dataset.sub ? undefined : t.dataset.sub; draw(); }
      else if (t.dataset.pick) { f.catId = t.dataset.pick; catOpen = false; draw(); }
      else if (t.dataset.cur) {
        const c = t.dataset.cur;
        if (c === "AZN") {
          // Manata qayıdanda hesablanmış məbləğ saxlanır
          const v = effAmt(f);
          f.amount = v > 0 ? plainNum(v).replace(" ", "") : "";
          f.cur = "AZN"; delete f.orig; delete f.rate;
        } else {
          f.cur = c; f.orig = f.orig ?? ""; f.rate = f.rate ?? String(lastRate(c)).replace(".", ",");
        }
        draw();
      }
      else if (t.hasAttribute("data-save")) {
        const cur = curOf(f);
        const amount = Math.round(effAmt(f) * 100) / 100;
        if (!(amount > 0) || !f.catId || !f.date) return;
        const rec = { id: f.id, kind: f.kind, amount, catId: f.catId, date: f.date, note: (f.note || "").trim(), created: f.created || Date.now() };
        if (cur) {
          const rate = Math.round(parseNum(f.rate) * 10000) / 10000;
          rec.cur = cur; rec.orig = Math.round(parseNum(f.orig) * 100) / 100; rec.rate = rate;
          setLastRate(cur, rate);
        }
        if (f.kind === "expense") rec.type = f.type;
        if (f.kind === "expense" && f.sub && isUtil(catById(f.catId))) rec.sub = f.sub;
        if (!(f.kind === "expense" && f.pay === "card") && f.acc === "cash") rec.acc = "cash";
        if (f.kind === "expense" && f.pay === "card") { rec.pay = "card"; rec.cardId = f.cardId || (record && record.pay === "card" ? cardIdOf(record) : state.cards[0]?.id || DEFAULT_CARD); }
        store.saveRecord(rec);
        onSaved && onSaved(rec);
        const d = parseYmd(rec.date);
        if (monthKey(d) !== monthKey(state.month)) { state.month = new Date(d.getFullYear(), d.getMonth(), 1); render(); }
        onDone ? onDone() : closeSheet(); toast(editing ? "Yeniləndi" : "Əlavə edildi");
      }
    };
    draw();
  }

  // ---------- Kateqoriya forması ----------
  function openCatSheet(cat) {
    const editing = !!cat;
    const f = cat ? { ...cat } : { id: uid().slice(0, 12), name: "", kind: state.catKind };
    let confirmDel = false;
    const used = cat ? state.records.filter(r => r.catId === cat.id).length : 0;
    const draw = () => {
      sheet(`
        <div class="sheet-head">
          <button class="link" data-close>Ləğv et</button>
          <h2>${editing ? "Kateqoriya" : (f.kind === "expense" ? "Yeni xərc maddəsi" : "Yeni gəlir mənbəyi")}</h2>
          <button class="link save" data-save ${f.name.trim() ? "" : "disabled"}>Saxla</button>
        </div>
        <div class="stack">
          <label class="field"><span>Ad</span><input id="c-name" class="input" value="${esc(f.name)}" placeholder="Məsələn: İdman zalı" maxlength="40"></label>
          ${editing ? `<button class="danger ${confirmDel ? "confirm" : ""}" data-del>${confirmDel ? "Silməyi təsdiqləyin" : "Kateqoriyanı sil"}</button>
          ${used ? `<p class="note">Bu kateqoriyada ${used} əməliyyat var. Silsəniz, onlar "Kateqoriyasız" kimi qalacaq.</p>` : ""}` : ""}
        </div>`);
      const n = $("#c-name");
      n.addEventListener("input", () => { f.name = n.value; $("[data-save]").disabled = !n.value.trim(); });
      if (!editing) setTimeout(() => n.focus(), 50);
    };
    sheetHandler = e => {
      const t = e.target.closest("button");
      if (!t) return;
      if (t.hasAttribute("data-save")) {
        const name = f.name.trim(); if (!name) return;
        const cats = state.categories.slice();
        const i = cats.findIndex(c => c.id === f.id);
        if (i >= 0) cats[i] = { ...cats[i], name }; else cats.push({ id: f.id, name, kind: f.kind });
        store.saveCategories(cats); closeSheet(); toast("Yadda saxlanıldı");
      } else if (t.hasAttribute("data-del")) {
        if (!confirmDel) { confirmDel = true; draw(); }
        else { store.saveCategories(state.categories.filter(c => c.id !== f.id)); closeSheet(); toast("Silindi"); }
      }
    };
    draw();
  }

  // ---------- Pəncərə (sheet) və bildiriş ----------
  let sheetHandler = null;
  function sheet(html) {
    const root = $("#sheetRoot");
    root.innerHTML = `<div class="sheet-bg" data-bg><div class="sheet" role="dialog" aria-modal="true">${html}</div></div>`;
  }
  // ---------- Xatırladıcı pəncərələri ----------
  function openOccurrenceSheet(key) {
    const [rid, ym] = key.split("|");
    const [yy, mm] = ym.split("-").map(Number);
    const o = occurrences(yy, mm - 1).find(x => x.key === key); if (!o) return;
    const r = o.r, done = o.done, date = o.date;
    sheet(`
      <div class="sheet-head">
        <button class="link" data-close>Bağla</button>
        <h2>${esc(r.title)}</h2>
        <span></span>
      </div>
      <div class="stack">
        <p class="note" style="font-size:15px">${MONTHS[mm - 1]} ${yy} · xatırlatma: ${daysOf(o)}${r.amount ? " · " + money(r.amount) : ""}</p>
        ${done ? `<button class="secondary" data-undo>Ödənilməyib kimi qeyd et</button>` : `
          <button class="primary" data-write>Ödənişi xərc kimi yaz</button>
          <button class="secondary" data-markdone>Sadəcə ödənildi kimi qeyd et</button>`}
        <p class="note">"Xərc kimi yaz" seçsəniz, məbləği daxil edirsiniz, xərc əlavə olunur və xatırladıcı ödənildi kimi işarələnir.</p>
      </div>`);
    sheetHandler = e => {
      const t = e.target.closest("button"); if (!t) return;
      if (t.hasAttribute("data-markdone")) { store.setDone(key, true); closeSheet(); toast("Ödənildi kimi qeyd edildi"); }
      else if (t.hasAttribute("data-undo")) {
        const d = { ...state.done };
        Object.keys(d).forEach(k => { if (k === key || k.startsWith(key + "-")) delete d[k]; });
        state.done = d; store.saveMeta(); closeSheet();
      }
      else if (t.hasAttribute("data-write")) {
        const today = ymd(new Date());
        openRecordSheet(null,
          { kind: "expense", type: r.type || "need", catId: r.catId || null, amount: r.amount ? String(r.amount).replace(".", ",") : "", note: r.title, date: date < today ? today : date },
          () => store.setDone(key, true));
      }
    };
  }

  function openRemindersManager() {
    const draw = () => sheet(`
      <div class="sheet-head">
        <button class="link" data-close>Bağla</button>
        <h2>Xatırladıcılar</h2>
        <span></span>
      </div>
      <div class="stack">
        <div class="list">${state.reminders.map(r => `
          <button class="row" data-editrem="${esc(r.id)}">
            ${badge(r.title)}
            <span class="t"><div>${esc(r.title)}</div><div class="sub">${daysLabel(r.days || [])}${r.amount ? " · " + money(r.amount) : ""}</div></span>
            <span class="chev">›</span>
          </button>`).join("") || `<div class="empty">Hələ xatırladıcı yoxdur.</div>`}
        </div>
        <button class="primary" data-newrem>+ Yeni xatırladıcı</button>
        <p class="note">Telefona bildiriş gəlməsi üçün bu ödənişləri telefonun təqviminə də əlavə edə bilərsiniz.</p>

    sheetHandler = e => {
      const t = e.target.closest("button"); if (!t) return;
      if (t.dataset.editrem) openReminderEdit(state.reminders.find(r => r.id === t.dataset.editrem));
      else if (t.hasAttribute("data-newrem")) openReminderEdit(null);

    draw();

  function openReminderEdit(rem) {
    const editing = !!rem;
    const f = rem ? { ...rem, daysText: (rem.days || []).join(", "), amountText: rem.amount ? String(rem.amount).replace(".", ",") : "" }
                  : { id: "r-" + uid().slice(0, 10), title: "", daysText: "", amountText: "", type: "need", catId: "" };
    let confirmDel = false;
    const parseDays = () => [...new Set(f.daysText.split(/[^0-9]+/).map(Number).filter(n => n >= 1 && n <= 31))].sort((a, b) => a - b);
    const valid = () => f.title.trim() && parseDays().length;
    const draw = () => {
      const cats = state.categories.filter(c => c.kind === "expense");
      sheet(`
        <div class="sheet-head">
          <button class="link" data-back>‹ Geri</button>
          <h2>${editing ? "Xatırladıcı" : "Yeni xatırladıcı"}</h2>
          <button class="link save" data-save ${valid() ? "" : "disabled"}>Saxla</button>
        </div>
        <div class="stack">
          <label class="field"><span>Ad</span><input id="r-title" class="input" value="${esc(f.title)}" placeholder="Məsələn: İpoteka" maxlength="40"></label>
          <label class="field"><span>Ayın hansı günləri (vergüllə)</span><input id="r-days" class="input num" inputmode="numeric" value="${esc(f.daysText)}" placeholder="Məsələn: 1, 5"></label>
          <label class="field"><span>Məbləğ (istəyə bağlı)</span><input id="r-amount" class="input num" inputmode="decimal" value="${esc(f.amountText)}" placeholder="0 ₼"></label>
          <div class="field"><span>Başlıq</span><div class="types">${TYPES.map(t => `
            <button class="type" style="--c:${t.color}" data-type="${t.id}" aria-pressed="${f.type === t.id}"><span class="dot" style="background:${t.color}"></span>${t.title}</button>`).join("")}</div></div>
          <label class="field"><span>Xərc maddəsi</span>
            <select id="r-cat" class="input"><option value="">Seçilməyib</option>${cats.map(c => `<option value="${esc(c.id)}" ${c.id === f.catId ? "selected" : ""}>${esc(c.name)}</option>`).join("")}</select>
          </label>
          ${editing ? `<button class="danger ${confirmDel ? "confirm" : ""}" data-del>${confirmDel ? "Silməyi təsdiqləyin" : "Xatırladıcını sil"}</button>` : ""}
        </div>`);
      const upd = () => { $("[data-save]").disabled = !valid(); };
      $("#r-title").addEventListener("input", e => { f.title = e.target.value; upd(); });
      $("#r-days").addEventListener("input", e => { f.daysText = e.target.value; upd(); });
      $("#r-amount").addEventListener("input", e => { f.amountText = e.target.value; });
      $("#r-cat").addEventListener("change", e => { f.catId = e.target.value; });
    };
    sheetHandler = e => {
      const t = e.target.closest("button"); if (!t) return;
      if (t.hasAttribute("data-back")) openRemindersManager();
      else if (t.dataset.type) { f.type = t.dataset.type; draw(); }
      else if (t.hasAttribute("data-del")) {
        if (!confirmDel) { confirmDel = true; draw(); }
        else { store.saveReminders(state.reminders.filter(r => r.id !== f.id)); toast("Silindi"); openRemindersManager(); }
      }
      else if (t.hasAttribute("data-save")) {
        if (!valid()) return;
        const amount = parseFloat(f.amountText.replace(",", "."));
        const item = { id: f.id, title: f.title.trim(), days: parseDays(), type: f.type, catId: f.catId || null, amount: amount > 0 ? Math.round(amount * 100) / 100 : null };
        const list = state.reminders.slice();
        const i = list.findIndex(r => r.id === f.id);
        if (i >= 0) list[i] = item; else list.push(item);
        store.saveReminders(list); toast("Yadda saxlanıldı"); openRemindersManager();
      }
    };
    draw();
  }

  // ---------- Ay seçimi (təqvim) ----------
  function openMonthPicker() {
    let year = state.month.getFullYear();
    let mode = "months", month = state.month.getMonth();
    const has = new Set(state.records.map(r => (r.date || "").slice(0, 7)));
    const now = new Date();
    const chevL = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>`;
    const chevR = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>`;
    // Kiçik məbləğ: 1 250, 12k
    const short = v => v >= 10000 ? Math.round(v / 1000) + "k" : String(Math.round(v)).replace(/\B(?=(\d{3})+(?!\d))/g, " ");

    const monthsHtml = () => `
      <div class="sheet-head">
        <button class="link" data-close>Bağla</button>
        <h2>Ay seçin</h2>
        <button class="link save" data-today>Bu ay</button>
      </div>
      <div class="stack">
        <div class="cal-head">
          <button class="icon-btn" data-year="-1" aria-label="Əvvəlki il">${chevL}</button>
          <b class="num">${year}</b>
          <button class="icon-btn" data-year="1" aria-label="Növbəti il">${chevR}</button>
        </div>
        <div class="cal-grid">${MONTHS.map((name, i) => {
          const k = `${year}-${pad(i + 1)}`;
          const cls = ["cal-m", has.has(k) ? "has" : "", year === now.getFullYear() && i === now.getMonth() ? "today" : ""].join(" ");
          return `<button class="${cls}" data-pickmonth="${i}" aria-pressed="${k === monthKey(state.month)}">${name}<i></i></button>`;
        }).join("")}</div>
        <p class="note">Nöqtə olan aylarda qeyd edilmiş əməliyyat var.</p>
      </div>`;

    const daysHtml = () => {
      const k = `${year}-${pad(month + 1)}`;
      const spent = {};
      state.records.forEach(r => {
        if (r.kind === "expense" && r.date && r.date.startsWith(k)) spent[r.date] = (spent[r.date] || 0) + (Number(r.amount) || 0);
      });
      const total = Object.values(spent).reduce((a, b) => a + b, 0);
      const remDays = new Set(occurrences(year, month).filter(o => !o.done).flatMap(o => o.dates));
      const first = new Date(year, month, 1);
      const lead = (first.getDay() + 6) % 7; // həftə bazar ertəsindən başlayır
      const count = new Date(year, month + 1, 0).getDate();
      const cells = [];
      for (let i = 0; i < lead; i++) cells.push(`<button class="cal-d" disabled></button>`);
      for (let d = 1; d <= count; d++) {
        const key = `${k}-${pad(d)}`, v = spent[key] || 0;
        const today = key === ymd(now);
        cells.push(`<button class="cal-d ${v ? "spent" : ""} ${today ? "today" : ""} ${remDays.has(key) ? "has-rem" : ""}" data-day="${key}" aria-label="${d} ${MONTHS[month]}${v ? ", " + money(v) + " xərc" : ""}">
          <b class="num">${d}</b>${v ? `<small class="num">${short(v)}</small>` : ""}</button>`);
      }
      return `
        <div class="sheet-head">
          <button class="link" data-back>‹ Aylar</button>
          <h2>Günlər</h2>
          <button class="link save" data-openmonth>Aç</button>
        </div>
        <div class="stack">
          <div class="cal-head">
            <button class="icon-btn" data-mstep="-1" aria-label="Əvvəlki ay">${chevL}</button>
            <b>${MONTHS[month]} ${year}</b>
            <button class="icon-btn" data-mstep="1" aria-label="Növbəti ay">${chevR}</button>
          </div>
          <div>
            <div class="cal-wd"><span>B.e</span><span>Ç.a</span><span>Ç</span><span>C.a</span><span>C</span><span>Ş</span><span>B</span></div>
            <div class="cal-days" style="margin-top:6px">${cells.join("")}</div>
          </div>
          <div class="cal-sum"><span>Ay ərzində xərc</span><b class="num">${money(total)}</b></div>
          <p class="note">Günə toxunsanız, həmin günün əməliyyatları açılır. Narıncı nöqtə: ödəniş xatırladıcısı.</p>
        </div>`;
    };

    const draw = () => sheet(mode === "months" ? monthsHtml() : daysHtml());
    const go = (y, m) => { state.month = new Date(y, m, 1); closeSheet(); render(); };
    sheetHandler = e => {
      const t = e.target.closest("button"); if (!t) return;
      if (t.dataset.year) { year += Number(t.dataset.year); draw(); }
      else if (t.dataset.pickmonth) { month = Number(t.dataset.pickmonth); mode = "days"; draw(); }
      else if (t.dataset.mstep) { const d = new Date(year, month + Number(t.dataset.mstep), 1); year = d.getFullYear(); month = d.getMonth(); draw(); }
      else if (t.hasAttribute("data-back")) { mode = "months"; draw(); }
      else if (t.hasAttribute("data-openmonth")) go(year, month);
      else if (t.hasAttribute("data-today")) go(now.getFullYear(), now.getMonth());
      else if (t.dataset.day) {
        const day = t.dataset.day;
        state.tab = "records"; state.filter = "all";
        go(year, month);
        const el = document.getElementById("d-" + day);
        if (el) el.scrollIntoView({ behavior: "smooth", block: "start" });
        else toast(`${dayTitle(day)}: əməliyyat yoxdur`);
      }
    };
    draw();
  }

  // Maddə seçimi ayrıca tam pəncərədə açılır: uzun siyahı rahat sürüşür, seçəndə forma geri qayıdır
  function openPicker(title, items, selected, onPick) {
    let root = $("#pickRoot");
    if (!root) { root = document.createElement("div"); root.id = "pickRoot"; document.body.appendChild(root); }
    let q = "";
    const close = () => { root.innerHTML = ""; root.onclick = null; };
    const rows = () => items.filter(c => !q || c.name.toLocaleLowerCase("az").includes(q)).map(c => `
      <button class="row" data-pick="${esc(c.id)}" aria-pressed="${selected === c.id}">
        ${badge(c.name)}<span class="t"><div>${esc(c.name)}</div></span><span class="check">${selected === c.id ? "✓" : ""}</span>
      </button>`).join("") || `<div class="empty">Tapılmadı.</div>`;
    root.innerHTML = `<div class="sheet-bg pick-bg" data-pbg><div class="sheet pick" role="dialog" aria-modal="true" aria-label="${esc(title)}">
      <div class="sheet-head"><button class="link" data-pclose>Bağla</button><h2>${esc(title)}</h2><span></span></div>
      ${items.length > 8 ? `<input id="pick-q" class="input" type="search" placeholder="Axtar…" autocomplete="off" style="margin-bottom:10px">` : ""}
      <div class="list" id="pick-list">${rows()}</div>
    </div></div>`;
    $("#pick-q")?.addEventListener("input", e => { q = e.target.value.trim().toLocaleLowerCase("az"); $("#pick-list").innerHTML = rows(); });
    root.onclick = e => {
      if (e.target.hasAttribute("data-pbg") || e.target.closest("[data-pclose]")) return close();
      const b = e.target.closest("[data-pick]"); if (b) { close(); onPick(b.dataset.pick); }
    };
  }
  function closeSheet() { $("#sheetRoot").innerHTML = ""; sheetHandler = null; }
  $("#sheetRoot").addEventListener("click", e => {
    if (e.target.hasAttribute("data-bg") || e.target.closest("[data-close]")) return closeSheet();
    sheetHandler && sheetHandler(e);
  });
  document.addEventListener("keydown", e => { if (e.key === "Escape") closeSheet(); });

  let toastTimer;
  function toast(msg) {
    $("#toastRoot").innerHTML = `<div class="toast" role="status">${esc(msg)}</div>`;
    clearTimeout(toastTimer); toastTimer = setTimeout(() => { $("#toastRoot").innerHTML = ""; }, 2200);
  }
  // Silkələyəndə geri al (iPhone-dakı kimi). iOS-da icazə üçün bir düymə basmaq lazımdır.
  const SHAKE_KEY = "budcem.shakeUndo";
  let shakeOn = false, lastShake = 0;
  // Ayar yadda qalır: "Açıq" yazılıbsa, iOS-da hər açılışda bir dəfə düyməyə basmaq lazımdır (Apple icazəni tətbiqə bir dəfəlik verir)
  const shakeWanted = () => { try { return localStorage.getItem(SHAKE_KEY) === "1"; } catch (e) { return false; } };
  const shakeLabel = () => `Silkələyəndə geri al: ${shakeOn ? "Açıq" : shakeWanted() ? "Açıq (aktiv etmək üçün basın)" : "Bağlı"}`;
  function onMotion(e) {
    const a = e.accelerationIncludingGravity; if (!a) return;
    const m = Math.sqrt((a.x || 0) ** 2 + (a.y || 0) ** 2 + (a.z || 0) ** 2);
    const now = Date.now();
    if (m > 26 && now - lastShake > 1500) { lastShake = now; if (store.shakeArmed && store.undo()) toast("Geri alındı"); }
  }
  async function setShake(on) {
    if (on) {
      try { if (typeof DeviceMotionEvent !== "undefined" && typeof DeviceMotionEvent.requestPermission === "function") { if (await DeviceMotionEvent.requestPermission() !== "granted") return false; } }
      catch (e) { return false; }
      window.addEventListener("devicemotion", onMotion);
    } else window.removeEventListener("devicemotion", onMotion);
    shakeOn = on;
    try { localStorage.setItem(SHAKE_KEY, on ? "1" : "0"); } catch (e) {}
    return on;
  }

  // ---------- Hadisələr ----------
  document.querySelector(".tabbar").addEventListener("click", e => {
    const b = e.target.closest("button[data-tab]"); if (!b) return;
    state.tab = b.dataset.tab; render(); window.scrollTo(0, 0);
  });
  $("#monthLabel").addEventListener("click", openMonthPicker);
  $("#prevM").addEventListener("click", () => { state.month = new Date(state.month.getFullYear(), state.month.getMonth() - 1, 1); render(); });
  $("#nextM").addEventListener("click", () => { state.month = new Date(state.month.getFullYear(), state.month.getMonth() + 1, 1); render(); });
  $("#fab").addEventListener("click", () => state.ready && openRecordSheet(null));
  // Sola sürüşdürmə: sətir 76px açılır və zibil qabı görünür. Açıq sətri yenidən sola sürüşdürmək onu silir.
  let sw = null, suppressClick = 0;
  const closeSwipes = except => document.querySelectorAll(".swipe.open").forEach(x => x !== except && x.classList.remove("open"));
  $("#view").addEventListener("touchstart", e => {
    const s = e.target.closest(".swipe");
    closeSwipes(s);
    if (!s || e.target.closest(".swipe-del")) { sw = null; return; }
    const t = e.touches[0];
    sw = { s, row: s.querySelector(".row"), x0: t.clientX, y0: t.clientY, dx: 0, dir: null, base: s.classList.contains("open") ? -76 : 0 };
  }, { passive: true });
  $("#view").addEventListener("touchmove", e => {
    if (!sw) return;
    const t = e.touches[0], dx = t.clientX - sw.x0, dy = t.clientY - sw.y0;
    if (!sw.dir && (Math.abs(dx) > 8 || Math.abs(dy) > 8)) sw.dir = Math.abs(dx) > Math.abs(dy) ? "h" : "v";
    if (sw.dir !== "h") return;
    sw.dx = dx;
    sw.s.classList.add("dragging");
    sw.row.style.transform = `translateX(${Math.max(sw.base ? -sw.s.offsetWidth : -110, Math.min(0, sw.base + dx))}px)`;
  }, { passive: true });
  $("#view").addEventListener("touchend", () => {
    if (!sw) return;
    if (sw.dir === "h" && sw.base && sw.dx < -30) {
      const { s, row } = sw, id = s.querySelector(".swipe-del")?.dataset.delrec;
      row.style.transition = "transform .18s ease-in"; row.style.transform = "translateX(-100%)";
      suppressClick = Date.now() + 400; sw = null;
      setTimeout(() => { if (id) { store.deleteRecord(id); toast("Silindi"); } }, 180);
      return;
    }
    if (sw.dir === "h") {
      sw.s.classList.remove("dragging");
      sw.row.style.transform = "";
      sw.s.classList.toggle("open", sw.base + sw.dx < -38);
      suppressClick = Date.now() + 400;
    }
    sw = null;
  });
  // Sürüşdürmədən sonra gələn klik sətri açmasın; açıq sətrə toxunmaq onu bağlasın
  $("#view").addEventListener("click", e => {
    if (Date.now() < suppressClick) { e.stopPropagation(); e.preventDefault(); return; }
    const s = e.target.closest(".swipe");
    if (s && s.classList.contains("open") && !e.target.closest(".swipe-del")) { s.classList.remove("open"); e.stopPropagation(); }
    else if (!s) closeSwipes();
  }, true);

  $("#view").addEventListener("change", e => {
    const t = e.target;
    if (t.hasAttribute("data-rangefrom")) { state.sumFrom = t.value; render(); }
    else if (t.hasAttribute("data-rangeto")) { state.sumTo = t.value; render(); }
  });
  $("#view").addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b) return;
    if (b.dataset.filter) { state.filter = b.dataset.filter; render(); }
    else if (b.dataset.occ) openOccurrenceSheet(b.dataset.occ);
    else if (b.hasAttribute("data-openrem")) openRemindersSheet();
    else if (b.hasAttribute("data-report")) openReport();
    else if (b.dataset.planedit) openPlanEdit(b.dataset.planedit);
    else if (b.hasAttribute("data-planall")) { state.planShowAll = !state.planShowAll; render(); }
    else if (b.hasAttribute("data-togglesum")) { state.catsOpen = !state.catsOpen; render(); }
    else if (b.dataset.month) { const [y, m] = b.dataset.month.split("-").map(Number); state.month = new Date(y, m - 1, 1); render(); window.scrollTo({ top: 0, behavior: "smooth" }); }
    else if (b.dataset.edit) { const r = state.records.find(x => x.id === b.dataset.edit); r && (r.kind === "cardpay" ? openCardPaySheet(r) : r.kind === "transfer" ? openTransferSheet(r) : openRecordSheet(r)); }
    else if (b.hasAttribute("data-opencard")) openCardSheet();
    else if (b.hasAttribute("data-transfer")) openTransferSheet();
    else if (b.hasAttribute("data-newsclose")) seeNews();
    else if (b.hasAttribute("data-newsopen")) { seeNews(); openFeedback(); }
    else if (b.dataset.delrec) { store.deleteRecord(b.dataset.delrec); toast("Silindi"); }
    else if (b.dataset.period) {
      state.sumPeriod = b.dataset.period;
      if (state.sumPeriod === "range" && !state.sumFrom && !state.sumTo) {
        state.sumFrom = ymd(new Date(state.month.getFullYear(), state.month.getMonth(), 1));
        state.sumTo = ymd(new Date());
      }
      render();
    }
    else if (b.dataset.catkind) { state.catKind = b.dataset.catkind; render(); }
    else if (b.dataset.cat) { const c = catById(b.dataset.cat); c && openCatSheet(c); }
    else if (b.hasAttribute("data-newcat")) openCatSheet(null);
    else if (b.hasAttribute("data-mergelocal")) store.mergeLocal();
    else settingsAction(b);
  });

  // Ehtiyat nüsxədən bərpa (telefon rejimində və bulud hesabında)
  document.addEventListener("change", e => {
    if (e.target.id !== "restoreFile" || !e.target.files[0]) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const d = JSON.parse(reader.result);
        if (d.app !== "budcem" || !Array.isArray(d.records)) throw new Error("format");
        store.replaceAll(d);
        toast(`Bərpa edildi: ${d.records.length} əməliyyat`);
      } catch (err) { toast("Bu fayl Büdcəm ehtiyat nüsxəsi deyil."); }
    };
    reader.readAsText(e.target.files[0]);
    e.target.value = "";
  });

  render();
  store.init();
  // Açılışda: əgər əvvəl açılıbsa və icazə lazım deyilsə (Android), dinləməyə başla. iOS-da bir dəfə düyməyə basmaq lazımdır.
  try {
    const needsTap = typeof DeviceMotionEvent !== "undefined" && typeof DeviceMotionEvent.requestPermission === "function";
    if (localStorage.getItem(SHAKE_KEY) === "1" && !needsTap) setShake(true);
  } catch (e) {}

  // ---------- Görünüş (açıq / tünd rejim) ----------
  // Açarla seçilən rejim bu cihazda yadda qalır; seçim edilməyibsə, telefonun ayarı istifadə olunur
  const MODE_KEY = "budcem.mode";
  const sysDark = window.matchMedia ? window.matchMedia("(prefers-color-scheme: dark)") : null;
  function getMode() { try { return localStorage.getItem(MODE_KEY); } catch (e) { return null; } }
  function isDark() {
    const m = getMode();
    if (m === "dark" || m === "light") return m === "dark";
    const host = document.documentElement.getAttribute("data-theme");
    if (host === "dark" || host === "light") return host === "dark";
    return !!sysDark?.matches;
  }
  function applyMode() {
    const m = getMode();
    if (m === "dark" || m === "light") document.documentElement.setAttribute("data-mode", m);
    else document.documentElement.removeAttribute("data-mode");
    $("#themeBtn")?.setAttribute("aria-checked", String(isDark()));
  }
  applyMode();
  sysDark?.addEventListener?.("change", applyMode);
  $("#settingsBtn").addEventListener("click", openSettings);
  // Tünd rejim açarı Ayarlar pəncərəsindədir
  window.toggleMode = () => {
    try { localStorage.setItem(MODE_KEY, isDark() ? "light" : "dark"); } catch (e) {}
    applyMode();
  };

  // Ayrıca PWA kimi açılanda oflayn işləmək üçün
  if ("serviceWorker" in navigator && location.protocol === "https:" && !window.claude) {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  }
})();
</script>
