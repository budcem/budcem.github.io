<title>Büdcəm</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: one phone-width column, sticky month bar on top, tab bar fixed at the bottom, add button floating above it */
:root {
  --bg: #f3f5f4;
  --surface: #ffffff;
  --surface-2: #e8edeb;
  --fg: #16201d;
  --muted: #5f6c68;
  --line: #dde3e1;
  --accent: #0f766e;
  --accent-fg: #ffffff; --seg-on: #ffffff;
  --income: #15803d;
  --expense: #b42318;
  --need: #2563eb;
  --want: #db2777;
  --invest: #16a34a;
  --credit: #ea580c;
  --shadow: 0 1px 2px rgba(16, 40, 34, .06), 0 4px 16px rgba(16, 40, 34, .06);
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-display: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --tabbar-h: 58px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d1412; --surface: #16201d; --surface-2: #1f2b28; --fg: #e8efec; --muted: #94a39e; --line: #263431;
    --accent: #2dd4bf; --accent-fg: #062b27; --seg-on: #3d544e; --income: #4ade80; --expense: #f87171;
    --need: #60a5fa; --want: #f472b6; --invest: #4ade80; --credit: #fb923c;
    --shadow: 0 1px 2px rgba(0,0,0,.4); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d1412; --surface: #16201d; --surface-2: #1f2b28; --fg: #e8efec; --muted: #94a39e; --line: #263431;
  --accent: #2dd4bf; --accent-fg: #062b27; --seg-on: #3d544e; --income: #4ade80; --expense: #f87171;
  --need: #60a5fa; --want: #f472b6; --invest: #4ade80; --credit: #fb923c;
  --shadow: 0 1px 2px rgba(0,0,0,.4); color-scheme: dark;
}
:root[data-mode="light"] {
  --bg: #f3f5f4; --surface: #ffffff; --surface-2: #e8edeb; --fg: #16201d; --muted: #5f6c68; --line: #dde3e1;
  --accent: #0f766e; --accent-fg: #ffffff; --seg-on: #ffffff; --income: #15803d; --expense: #b42318;
  --need: #2563eb; --want: #db2777; --invest: #16a34a; --credit: #ea580c;
  --shadow: 0 1px 2px rgba(16, 40, 34, .06), 0 4px 16px rgba(16, 40, 34, .06); color-scheme: light;
}
:root[data-mode="dark"] {
  --bg: #0d1412; --surface: #16201d; --surface-2: #1f2b28; --fg: #e8efec; --muted: #94a39e; --line: #263431;
  --accent: #2dd4bf; --accent-fg: #062b27; --seg-on: #3d544e; --income: #4ade80; --expense: #f87171;
  --need: #60a5fa; --want: #f472b6; --invest: #4ade80; --credit: #fb923c;
  --shadow: 0 1px 2px rgba(0,0,0,.4); color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { background: var(--bg); color: var(--fg); }
/* Ekran böyüdülüb-kiçildilmir (barmaqla yaxınlaşdırma və iki dəfə toxunma bağlıdır) */
html { touch-action: pan-y; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body { overflow-x: clip; overscroll-behavior-x: none; }
body { font-family: var(--font); font-size: 16px; line-height: 1.4; -webkit-tap-highlight-color: transparent; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }

body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }

.wrap {
  max-width: 560px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 calc(var(--tabbar-h) + 96px + env(safe-area-inset-bottom, 0px));
}
.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg);
  display: flex; align-items: center; justify-content: space-between; gap: 8px; padding-block: 12px 10px;
}
.title-wrap { display: flex; align-items: center; gap: 8px; min-width: 0; }
.title-wrap h1 { overflow: hidden; text-overflow: ellipsis; }
.switch { flex: none; position: relative; width: 44px; height: 26px; border-radius: 13px; border: 0; padding: 0; background: var(--surface-2); box-shadow: inset 0 0 0 1px var(--line); transition: background .2s; }
.switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: 22px; height: 22px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.3); transition: transform .2s; }
.switch[aria-checked="true"] { background: var(--accent); box-shadow: none; }
.switch[aria-checked="true"]::after { transform: translateX(18px); }
.switch svg { position: absolute; width: 12px; height: 12px; top: 7px; right: 6px; color: var(--muted); }
.switch[aria-checked="true"] svg { left: 6px; right: auto; color: var(--accent-fg); }
.gear { flex: none; width: 34px; height: 34px; padding: 0; border: 0; border-radius: 50%; background: var(--surface-2); color: var(--muted); display: grid; place-items: center; box-shadow: inset 0 0 0 1px var(--line); }
.gear svg { width: 19px; height: 19px; }
.pw { position: relative; display: block; }
.pw input { padding-right: 48px; width: 100%; }
.eye { position: absolute; right: 4px; top: 50%; transform: translateY(-50%); width: 40px; height: 40px; padding: 0; border: 0; background: none; color: var(--muted); display: grid; place-items: center; }
.eye svg { width: 21px; height: 21px; }
.gear, .avatar { overflow: hidden; }
.gear img, .avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
.gear b { font-size: 13px; color: var(--accent); }
.crop { width: 260px; height: 260px; border-radius: 50%; overflow: hidden; box-shadow: 0 0 0 3px var(--accent); touch-action: none; }
.crop canvas { width: 260px; height: 260px; display: block; cursor: grab; touch-action: none; }
.accs { display: grid; grid-template-columns: 1fr 1fr auto; gap: 8px; margin-top: 10px; align-items: stretch; }
.acc { background: var(--surface-2); border-radius: 12px; padding: 8px 10px; min-width: 0; }
.acc small { display: block; font-size: 12px; color: var(--muted); }
.acc b { font-size: 15px; white-space: nowrap; }
.acc b.neg { color: var(--expense); }
.xfer { border: 0; border-radius: 12px; padding: 0 10px; background: var(--accent); color: var(--accent-fg); font-weight: 600; font-size: 13px; white-space: nowrap; }
#settingsBtn { position: relative; overflow: visible; }
#settingsBtn img { border-radius: 50%; }
.bell { position: absolute; top: -4px; right: -4px; width: 18px; height: 18px; border-radius: 50%; background: #e5372b; color: #fff; display: grid; place-items: center; box-shadow: 0 0 0 2px var(--bg); }
.bell[hidden] { display: none; }
.bell svg { width: 11px; height: 11px; }
.fb-btn { display: flex; align-items: center; justify-content: center; gap: 8px; }
.bell-pill { display: inline-flex; align-items: center; gap: 3px; background: #e5372b; color: #fff; border-radius: 10px; padding: 2px 7px 2px 5px; font-size: 12px; font-weight: 700; }
.bell-pill svg { width: 12px; height: 12px; }
.fb-list { display: grid; gap: 8px; }
.fb-item { padding: 12px 14px; }
.fb-meta { font-size: 12px; color: var(--muted); }
.fb-text { margin: 4px 0; white-space: pre-wrap; word-break: break-word; }
.fb-reply { margin-top: 6px; padding: 8px 10px; border-radius: 10px; background: color-mix(in srgb, var(--accent) 12%, transparent); white-space: pre-wrap; word-break: break-word; }
textarea.input { resize: vertical; min-height: 120px; font: inherit; font-size: 16px; line-height: 1.4; }
.subsplit { font-size: 12px; color: var(--muted); margin-top: 4px; }
.zoom { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 20px; }
.zoom input { flex: 1; accent-color: var(--accent); }
.profile { display: flex; align-items: center; gap: 14px; }
.avatar.big { position: relative; flex: none; width: 72px; height: 72px; padding: 0; border: 0; border-radius: 50%; background: var(--surface-2); color: var(--accent); display: grid; place-items: center; box-shadow: inset 0 0 0 1px var(--line); overflow: visible; }
.avatar.big img { border-radius: 50%; }
.avatar.big b { font-size: 26px; }
.avatar.big svg { width: 30px; height: 30px; color: var(--muted); }
.avatar .cam { position: absolute; right: -2px; bottom: -2px; width: 24px; height: 24px; border-radius: 50%; background: var(--accent); color: var(--accent-fg); font-size: 13px; display: grid; place-items: center; box-shadow: 0 0 0 2px var(--surface); }
.acct .sub { color: var(--muted); flex: none; }
.acct { justify-content: flex-start; }
@media (prefers-reduced-motion: reduce) { .switch, .switch::after { transition: none; } }
.modes { display: grid; gap: 8px; }
.mode { display: flex; align-items: center; gap: 12px; border: 1px solid var(--line); background: var(--surface); border-radius: 14px; padding: 14px; font-size: 16px; font-weight: 500; text-align: left; }
.mode svg { width: 22px; height: 22px; color: var(--accent); }
.mode span { flex: 1; }
.mode[aria-pressed="true"] { border-color: var(--accent); border-width: 2px; padding: 13px; }
.mode .check { visibility: hidden; }
.mode[aria-pressed="true"] .check { visibility: visible; }
.topbar h1 { white-space: nowrap; font-family: var(--font-display); font-size: clamp(18px, 5.6vw, 28px); font-weight: 700; letter-spacing: -.02em; margin: 0; }
.month { flex: none; display: flex; align-items: center; gap: 2px; background: var(--surface); border-radius: 999px; padding: 3px; box-shadow: var(--shadow); }
.month .mlabel { min-width: 76px; text-align: center; font-weight: 600; font-size: 15px; border: 0; background: transparent; padding: 6px 4px; border-radius: 999px; }
.month .mlabel:active { background: var(--surface-2); }
.cal-year { display: flex; align-items: center; justify-content: space-between; background: var(--surface); border-radius: 14px; padding: 6px; box-shadow: var(--shadow); }
.cal-year b { font-size: 20px; }
.cal-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.cal-m { border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 14px 4px 10px; font-size: 15px; font-weight: 500; display: flex; flex-direction: column; align-items: center; gap: 6px; }
.cal-m i { width: 6px; height: 6px; border-radius: 3px; background: transparent; }
.cal-m.has i { background: var(--accent); }
.cal-m.today { border-color: var(--accent); }
.cal-m[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
.cal-head { display: flex; align-items: center; justify-content: space-between; background: var(--surface); border-radius: 14px; padding: 6px; box-shadow: var(--shadow); }
.cal-head b { font-size: 18px; border: 0; background: transparent; }
.cal-wd { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; font-size: 11px; font-weight: 600; color: var(--muted); text-align: center; text-transform: uppercase; letter-spacing: .04em; }
.cal-days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
.cal-d { border: 0; background: var(--surface); border-radius: 10px; min-height: 52px; padding: 6px 1px 5px; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; gap: 3px; min-width: 0; }
.cal-d b { font-size: 15px; font-weight: 600; }
.cal-d small { font-size: 10px; line-height: 1.1; color: var(--expense); font-weight: 600; white-space: nowrap; overflow: hidden; max-width: 100%; }
.cal-d.today { outline: 2px solid var(--accent); outline-offset: -2px; }
.cal-d.spent { background: color-mix(in srgb, var(--expense) 8%, var(--surface)); }
.cal-d:disabled { visibility: hidden; }
.cal-sum { display: flex; justify-content: space-between; font-size: 14px; color: var(--muted); padding-inline: 4px; }
.cal-sum b { color: var(--expense); }
.cal-m.has[aria-pressed="true"] i { background: var(--accent-fg); }
.icon-btn { width: 34px; height: 34px; border-radius: 999px; border: 0; background: transparent; display: grid; place-items: center; color: var(--accent); }
.icon-btn:active { background: var(--surface-2); }
.icon-btn svg { width: 18px; height: 18px; }

.stack { display: flex; flex-direction: column; gap: 14px; }
.card { background: var(--surface); border-radius: 16px; padding: 16px; box-shadow: var(--shadow); }
.backup-nag { display: grid; gap: 10px; box-shadow: inset 0 0 0 1.5px color-mix(in srgb, var(--credit) 55%, transparent), var(--shadow); }
.backup-nag p { margin: 0; font-size: 14px; }
.news { display: grid; gap: 10px; box-shadow: inset 0 0 0 1.5px color-mix(in srgb, #e5372b 55%, transparent), var(--shadow); }
.news p { margin: 0; font-size: 14px; }
.news b { display: flex; align-items: center; gap: 6px; font-size: 15px; margin-bottom: 4px; }
.backup-nag b { display: block; font-size: 15px; margin-bottom: 2px; }
.label { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 10px; }

.balance .big { font-family: var(--font-display); font-size: 36px; font-weight: 700; letter-spacing: -.02em; margin: 2px 0 14px; }
.balance .big.neg { color: var(--expense); }
.split { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.split div { background: var(--surface-2); border-radius: 12px; padding: 10px 12px; }
.split small { display: block; color: var(--muted); font-size: 13px; }
.split b { font-size: 18px; }
.split .in b { color: var(--income); }
.split .out b { color: var(--expense); }

.donut-row { display: grid; grid-template-columns: 132px 1fr; gap: 16px; align-items: center; }
@media (max-width: 360px) { .donut-row { grid-template-columns: 1fr; justify-items: center; } }
.donut { width: 132px; height: 132px; }
.donut text { fill: var(--fg); }
.legend { display: flex; flex-direction: column; gap: 10px; min-width: 0; width: 100%; }
.legend-item { display: grid; grid-template-columns: 10px 1fr auto; gap: 8px; align-items: center; }
.dot { width: 10px; height: 10px; border-radius: 3px; }
.legend-item .pct { color: var(--muted); font-size: 13px; margin-left: 4px; }

.bars { display: flex; flex-direction: column; gap: 12px; }
.bar-row { display: grid; grid-template-columns: 32px 1fr auto; gap: 10px; align-items: center; }
.bar-row .name { font-size: 15px; min-width: 0; }
.track { height: 5px; background: var(--surface-2); border-radius: 3px; margin-top: 5px; overflow: hidden; }
.track i { display: block; height: 100%; background: var(--accent); border-radius: 3px; }

.badge { width: 32px; height: 32px; border-radius: 10px; display: grid; place-items: center; font-weight: 700; font-size: 14px; color: #fff; flex: none; }
.badge svg { width: 18px; height: 18px; }
.badge img { width: 100%; height: 100%; border-radius: 10px; object-fit: cover; }

.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 7px 14px; font-size: 15px; }
.seg.three { grid-template-columns: repeat(3, 1fr); }
.seg.three button { font-size: 14px; padding: 7px 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.range-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }
.range-row label { display: grid; gap: 4px; font-size: 12px; color: var(--muted); min-width: 0; }
.range-row .input { min-width: 0; width: 100%; }
.chip[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }

.day { scroll-margin-top: calc(env(safe-area-inset-top, 0px) + 70px); }
.day h3 { display: flex; justify-content: space-between; font-size: 13px; font-weight: 600; color: var(--muted); margin: 6px 4px 8px; }
.list { background: var(--surface); border-radius: 16px; box-shadow: var(--shadow); overflow: hidden; }
.row { display: grid; grid-template-columns: 32px 1fr auto; gap: 12px; align-items: center; padding: 12px 14px; width: 100%; border: 0; background: transparent; text-align: left; }
.row + .row { border-top: 1px solid var(--line); }
.row:active { background: var(--surface-2); }
.row .t { min-width: 0; }
/* Sola sürüşdürüb silmək: sətrin arxasında zibil qabı düyməsi */
.swipe { position: relative; overflow: hidden; }
.swipe + .swipe { border-top: 1px solid var(--line); }
.swipe .row { position: relative; z-index: 1; background: var(--surface); transition: transform .2s ease; touch-action: pan-y; }
.swipe.open .row { transform: translateX(-76px); }
.swipe.dragging .row { transition: none; }
.swipe-del { position: absolute; top: 0; right: 0; bottom: 0; width: 76px; border: 0; background: var(--expense); color: #fff; display: grid; place-items: center; }
.swipe-del svg { width: 22px; height: 22px; }
.swipe:not(.open):not(.dragging) .swipe-del { visibility: hidden; }
.row .t div { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .sub { font-size: 13px; color: var(--muted); }
.row .amt { font-weight: 600; }
.row .amt.in { color: var(--income); }
.chev { color: var(--muted); }

.empty { text-align: center; color: var(--muted); padding: 40px 16px; }
.empty b { display: block; color: var(--fg); font-size: 17px; margin-bottom: 4px; }

.seg { display: grid; grid-template-columns: 1fr 1fr; background: var(--surface-2); border-radius: 10px; padding: 3px; gap: 3px; }
.seg button { border: 0; background: transparent; border-radius: 8px; padding: 8px; font-weight: 600; font-size: 15px; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--seg-on, var(--surface)); color: var(--fg); box-shadow: var(--shadow); }

.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
  background: color-mix(in srgb, var(--surface) 92%, transparent); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px);
}
.tabbar nav { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); height: var(--tabbar-h); }
.tabbar button { border: 0; background: transparent; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 11px; font-weight: 500; color: var(--muted); }
.tabbar button svg { width: 24px; height: 24px; }
.tabbar button[aria-current="page"] { color: var(--accent); }

.fab {
  position: fixed; z-index: 21; right: max(18px, calc(env(safe-area-inset-right, 0px) + 18px));
  bottom: calc(var(--tabbar-h) + 16px + env(safe-area-inset-bottom, 0px));
  width: 58px; height: 58px; border-radius: 18px; border: 0; background: var(--accent); color: var(--accent-fg);
  display: grid; place-items: center; box-shadow: 0 6px 20px rgba(15, 118, 110, .35);
}
.fab svg { width: 26px; height: 26px; }
@media (min-width: 600px) { .fab { right: calc(50% - 280px + 18px); } }

.sheet-bg { position: fixed; inset: 0; z-index: 30; background: rgba(0, 0, 0, .38); display: flex; align-items: flex-end; justify-content: center; }
.sheet {
  width: 100%; max-width: 560px; max-height: 92vh; max-height: 92dvh; overflow-y: auto; overflow-x: hidden; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; touch-action: pan-y; background: var(--bg); border-radius: 20px 20px 0 0;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 calc(20px + env(safe-area-inset-bottom, 0px));
  animation: up .22s ease-out;
}
@keyframes up { from { transform: translateY(24px); } to { transform: none; } }
@media (prefers-reduced-motion: reduce) { .sheet { animation: none; } }
.sheet-head { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding-block: 16px 12px; position: sticky; top: 0; background: var(--bg); z-index: 1; }
.sheet-head h2 { margin: 0; font-size: 17px; font-weight: 600; }
.link { border: 0; background: transparent; color: var(--accent); font-size: 16px; padding: 6px 0; justify-self: start; }
.link.save { justify-self: end; font-weight: 600; }
.link:disabled { color: var(--muted); opacity: .5; }

.field { display: flex; flex-direction: column; gap: 6px; }
.field > span:not(.pw) { font-size: 13px; color: var(--muted); font-weight: 500; margin-left: 4px; }
.input { min-width: 0; max-width: 100%; display: block; }
input[type=date].input { -webkit-appearance: none; appearance: none; min-height: 48px; text-align: left; }
.input { width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 12px 14px; font-size: 16px; }
.amount-wrap { display: flex; align-items: baseline; gap: 6px; background: var(--surface); border-radius: 14px; padding: 12px 16px; border: 1px solid var(--line); }
.amount-wrap input { border: 0; background: transparent; font-family: var(--font-display); font-size: 36px; font-weight: 700; width: 100%; min-width: 0; outline: none; }
.amount-wrap em { font-style: normal; font-size: 26px; font-weight: 600; color: var(--muted); }

.types { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.type { border: 2px solid transparent; border-radius: 14px; padding: 12px; text-align: left; background: var(--surface); display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 15px; }
.type .dot { width: 12px; height: 12px; border-radius: 4px; }
.type[aria-pressed="true"] { border-color: var(--c); background: color-mix(in srgb, var(--c) 12%, var(--surface)); }

.danger { border: 0; width: 100%; background: var(--surface); color: var(--expense); border-radius: 12px; padding: 13px; font-weight: 600; }
.danger.confirm { background: var(--expense); color: #fff; }

.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(var(--tabbar-h) + 90px + env(safe-area-inset-bottom, 0px)); z-index: 40; background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-size: 14px; max-width: calc(100% - 32px); }
.picker .chev { transition: transform .15s; font-size: 20px; line-height: 1; }

.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

.tile > div { min-width: 0; }
.tbl-wrap { overflow-x: auto; background: var(--surface); border-radius: 14px; box-shadow: var(--shadow); -webkit-overflow-scrolling: touch; }
.tbl { border-collapse: separate; border-spacing: 0; font-size: 13px; font-variant-numeric: tabular-nums; min-width: 100%; }
.tbl th, .tbl td { padding: 9px 10px; text-align: right; white-space: nowrap; border-bottom: 1px solid var(--line); }

.plan-top { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.plan-top button, .plan-top div { border: 0; background: var(--surface-2); border-radius: 12px; padding: 10px; text-align: left; min-width: 0; }
.plan-top small { display: block; font-size: 12px; color: var(--muted); }
.plan-top b { font-size: 16px; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.prog { height: 8px; background: var(--surface-2); border-radius: 4px; overflow: hidden; }
.prog i { display: block; height: 100%; border-radius: 4px; background: var(--accent); max-width: 100%; }
.prog.over i { background: var(--expense); }
.plan-big { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin: 14px 0 8px; flex-wrap: wrap; }
.plan-big b { font-size: 22px; font-family: var(--font-display); }
.plan-big span { color: var(--muted); font-size: 14px; }
.plan-row { display: grid; grid-template-columns: 32px 1fr; gap: 12px; align-items: center; padding: 11px 0; border: 0; background: transparent; width: 100%; text-align: left; }
.plan-row + .plan-row { border-top: 1px solid var(--line); }
.plan-row .top { display: flex; justify-content: space-between; gap: 8px; margin-bottom: 6px; }
.plan-row .top span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.plan-row .top span:last-child { font-size: 14px; white-space: nowrap; }
.plan-row .msg { font-size: 12px; color: var(--muted); margin-top: 4px; }
.plan-row .msg.over { color: var(--expense); font-weight: 600; }
.plan-row .muted { color: var(--muted); }
.type-ic { width: 32px; height: 32px; border-radius: 10px; display: grid; place-items: center; }
.type-ic i { width: 12px; height: 12px; border-radius: 4px; }
.note { font-size: 13px; color: var(--muted); text-align: center; margin: 4px 8px; }
/* Giriş ekranı (bulud hesabı) */
.auth { position: fixed; inset: 0; z-index: 40; background: var(--bg); overflow-y: auto; padding: max(48px, env(safe-area-inset-top)) 16px 32px; }
.auth[hidden] { display: none; }
.auth .box { max-width: 380px; margin: 0 auto; display: grid; gap: 14px; }
.auth h1 { font-family: var(--font-display); font-size: 34px; margin: 0; }
.auth .lead { margin: -6px 0 6px; color: var(--muted); font-size: 15px; }
.auth .err { color: var(--expense); font-size: 14px; margin: 0; }
.auth .link { justify-self: center; }
.auth .warn { font-size: 14px; line-height: 1.45; padding: 12px 14px; border-radius: 14px; background: color-mix(in srgb, var(--expense) 12%, transparent); border: 1px solid color-mix(in srgb, var(--expense) 40%, transparent); }
.auth .code { font: 600 22px/1.4 ui-monospace, Menlo, monospace; letter-spacing: 1px; text-align: center; padding: 14px; border-radius: 14px; background: var(--card); border: 1px dashed var(--muted); user-select: all; word-break: break-all; }
.acct { display: flex; align-items: center; justify-content: space-between; gap: 12px; }

<script>
(() => {
  // ---------- Sabitlər ----------
  const TYPES = [
    { id: "need", title: "Ehtiyac", color: "var(--need)" },
    { id: "want", title: "İstək", color: "var(--want)" },
    { id: "investment", title: "İnvestisiya", color: "var(--invest)" },
    { id: "credit", title: "Kredit", color: "var(--credit)" }
  ];
  const TYPE = Object.fromEntries(TYPES.map(t => [t.id, t]));
  // Sonradan əlavə olunan gəlir maddələri. CATS_VERSION artanda köhnə məlumata bir dəfə əlavə olunur.
  const NEW_INCOME_CATS = [
    { id: "i5", name: "Cashback", kind: "income" },
    { id: "i6", name: "ƏDV geri al", kind: "income" }
  ];
  const CATS_VERSION = 3;
  // Kommunal maddəsində əlavə seçim: işıq, su, qaz. Köhnə yazılarda "sub" yoxdur, onlar olduğu kimi qalır.
  const UTIL_SUBS = ["İşıq", "Su", "Qaz"];
  const isUtil = c => !!c && c.kind === "expense" && (c.name || "").toLocaleLowerCase("az").startsWith("kommunal");
  const DEFAULT_CATS = [
    ...["Qida", "Restoran", "Nəqliyyat", "Yanacaq", "Kommunal", "İcarə", "Ev təmiri", "Maşın təmiri", "Maşın sığortası",
        "Sənədləşmə", "Səhiyyə", "Təhsil", "Geyim", "Rabitə və internet", "Əyləncə", "Hədiyyə", "Digər"]
      .map((name, i) => ({ id: "e" + i, name, kind: "expense" })),
    ...["Maaş", "Bonus", "Əlavə iş", "İnvestisiya gəliri", "Digər"]
      .map((name, i) => ({ id: "i" + i, name, kind: "income" })),
    ...NEW_INCOME_CATS
  ];
  // Köhnə versiyanın standart xatırladıcıları: dəyişdirilməyiblərsə silinir, siyahı boş başlayır
  const OLD_DEFAULT_REMINDERS = { "r-ipoteka": "İpoteka", "r-kommunal": "Kommunal", "r-ata-internet": "Ata internet", "r-ev-internet": "Ev internet" };
  const MONTHS = ["Yanvar", "Fevral", "Mart", "Aprel", "May", "İyun", "İyul", "Avqust", "Sentyabr", "Oktyabr", "Noyabr", "Dekabr"];
  const WEEKDAYS = ["Bazar", "Bazar ertəsi", "Çərşənbə axşamı", "Çərşənbə", "Cümə axşamı", "Cümə", "Şənbə"];
  const PALETTE = ["#0f766e", "#2563eb", "#7c3aed", "#db2777", "#ea580c", "#ca8a04", "#16a34a", "#0891b2", "#9333ea", "#be123c"];

  // ---------- Köməkçilər ----------
  const $ = s => document.querySelector(s);
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const money = v => {
    const neg = v < 0; v = Math.abs(v);
    const fixed = (Math.round(v * 100) / 100).toFixed(2);
    let [int, dec] = fixed.split(".");
    int = int.replace(/\B(?=(\d{3})+(?!\d))/g, " ");
    return (neg ? "−" : "") + int + (dec === "00" ? "" : "," + dec) + " ₼";
  };
  // Valyuta: məbləğ həmişə manatla (amount) saxlanır; xarici valyuta yalnız orig və kurs ilə qeyd olunur
  const CURRENCIES = [{ code: "AZN", label: "₼ AZN" }, { code: "USD", label: "$ USD" }, { code: "EUR", label: "€ EUR" }];
  const CUR_SYM = { USD: "$", EUR: "€" };
  const DEFAULT_RATE = { USD: 1.7, EUR: 2 };
  const parseNum = s => parseFloat(String(s ?? "").replace(/\s/g, "").replace(",", ".")) || 0;
  const plainNum = v => (Math.round(v * 100) / 100).toFixed(2).replace(/\.00$/, "").replace(".", ",").replace(/\B(?=(\d{3})+(?!\d))/g, " ");
  const curOf = f => (f.cur && f.cur !== "AZN" ? f.cur : null);
  const lastRate = c => { try { const v = parseFloat(localStorage.getItem("budcem.rate." + c)); return v > 0 ? v : DEFAULT_RATE[c]; } catch { return DEFAULT_RATE[c]; } };
  const setLastRate = (c, v) => { try { localStorage.setItem("budcem.rate." + c, String(v)); } catch {} };
  const effAmt = f => (curOf(f) ? parseNum(f.orig) * parseNum(f.rate) : parseNum(f.amount));
  const pad = n => String(n).padStart(2, "0");
  const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const parseYmd = s => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
  const monthKey = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}`;
  const dayTitle = s => { const d = parseYmd(s); return `${d.getDate()} ${MONTHS[d.getMonth()]}, ${WEEKDAYS[d.getDay()]}`; };
  const hue = name => { let h = 0; for (const c of name) h = (h * 31 + c.codePointAt(0)) >>> 0; return PALETTE[h % PALETTE.length]; };
  // Bəzi gəlir maddələri üçün ümumi ikon (brend loqosu deyil)
  const CAT_ICONS = {
    "maaş": `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="6" width="19" height="13" rx="2.5"/><circle cx="12" cy="12.5" r="2.5"/><path d="M6 9.5v0M18 15.5v0"/></svg>`,
    "bonus": `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 3.5l2.6 5.3 5.8.8-4.2 4.1 1 5.8L12 16.8 6.8 19.5l1-5.8-4.2-4.1 5.8-.8z"/></svg>`,

      try { await this.fb.auth.signOut(); } catch (e) {}
    },
    // Yeni (boş) hesaba bu telefondakı köhnə məlumat köçürülür. Hər telefon yalnız bir hesaba köçürür.
    localSeed() {
      let data = null, done = null;
      try { data = JSON.parse(localStorage.getItem(LS_KEY) || "null"); done = localStorage.getItem(UPLOADED_KEY); } catch (e) {}
      if (!data || done) return null;
      return data;
    },
    initLocal() {
      this.mode = "local";
      let data = null;
      try { data = JSON.parse(localStorage.getItem(LS_KEY) || "null"); } catch (e) {}
      state.categories = data?.categories || DEFAULT_CATS.slice();
      state.records = data?.records || [];
      state.reminders = data?.reminders || [];
      state.done = data?.done || {};
      state.plan = normPlan(data?.plan);
      state.cards = normCards(data?.cards, data?.cardOpening);
      state.profile = data?.profile || {};
      state.catsVersion = data ? (data.catsVersion || 1) : CATS_VERSION;
      state.ready = true;
      const migrated = [this.dropOldDefaults(), upgradeCats()].some(Boolean);
      if (!data || migrated) this.persistLocal();
      render();
    },
    persistLocal() {
      try { localStorage.setItem(LS_KEY, JSON.stringify({ categories: state.categories, records: state.records, reminders: state.reminders, done: state.done, plan: state.plan, cards: state.cards, cardOpening: state.cards[0]?.opening || 0, profile: state.profile, catsVersion: state.catsVersion })); }
      catch (e) { toast("Yadda saxlamaq alınmadı: brauzer yaddaşı əlçatan deyil."); }
    },
    initDb(db, id, path) {
      this.mode = "db";
      this.base = db.doc(path || `data/users/${id}/budget`);
      this.recs = this.base.collection("records");
      let gotCats = false, gotRecs = false;
      const done = () => { if (gotCats && gotRecs && !state.ready) { state.ready = true; } render(); };
      let metaSeq = 0, recSeq = 0;
      const unsubMeta = this.base.onSnapshot(async s => {
        const my = ++metaSeq;
        if (s.exists) {
          let d = s.data();
          const plain = !d.enc;
          if (d.enc) {
            if (!this.key) return toast("Məlumat şifrəlidir, amma açar tapılmadı. Çıxıb yenidən daxil olun.");
            try { d = await unsealJson(this.key, d.enc); } catch (e) { return toast("Məlumatı açmaq alınmadı."); }
            if (my !== metaSeq) return;
          }
          state.categories = d.categories || [];
          state.reminders = d.reminders || [];
          state.done = d.done || {};
          state.plan = normPlan(d.plan);
          state.cards = normCards(d.cards, d.cardOpening);
          state.profile = d.profile || {};
          state.catsVersion = d.catsVersion || 1;
          gotCats = true;
          if (!s.metadata.fromCache && !this.migrated) { this.migrated = true; if ([this.dropOldDefaults(), upgradeCats()].some(Boolean) || (plain && this.key)) this.saveMeta(); }
          done();
        }
        else if (!s.metadata.fromCache) {
          const seed = this.cloud ? this.localSeed() : null;
          state.categories = seed?.categories || DEFAULT_CATS.slice();
          state.reminders = seed?.reminders || []; state.done = seed?.done || {};
          state.plan = normPlan(seed?.plan);
          state.cards = normCards(seed?.cards, seed?.cardOpening);
          state.profile = seed?.profile || {};
          state.catsVersion = seed ? (seed.catsVersion || 1) : CATS_VERSION;
          if (seed) upgradeCats();
          this.migrated = true;
          gotCats = true; done();
          this.saveMeta();
          if (seed) {
            (seed.records || []).forEach(r => { const { id: rid, ...body } = r; this.putRec(rid, body).catch(() => {}); });
            try { localStorage.setItem(UPLOADED_KEY, id); } catch (e) {}
            toast(`Telefondakı ${(seed.records || []).length} əməliyyat hesaba köçürüldü`);
          }
        }
      }, e => this.fail(e));
      const unsubRecs = this.recs.onSnapshot(async q => {
        const my = ++recSeq;
        const list = await Promise.all(q.docs.map(d => this.readRec(d)));
        if (my !== recSeq) return;
        state.records = list.filter(Boolean);
        gotRecs = true; done();
        // Köhnə (şifrəsiz) yazılar bir dəfə şifrələnib yenidən yazılır
        if (this.key && !q.metadata.fromCache) q.docs.forEach(d => { if (!d.data().enc && !d.metadata.hasPendingWrites) { const { id, ...body } = d.data(); this.putRec(d.id, body).catch(() => {}); } });
      }, e => this.fail(e));
      this.unsubs = [unsubMeta, unsubRecs];
    },
    fail(e) {
      if (e?.code === "permission-denied") toast("Bazaya giriş qadağandır: Firestore qaydasını yoxlayın.");
      else toast("Məlumat bazası ilə əlaqə kəsildi. Səhifəni yeniləyin.");
    },
    // Hesab artıq doludursa (məs. başqa telefonda yaradılıb), bu telefondakı köhnə məlumat özü köçmür.
    // İstifadəçi düyməyə basanda çatışmayan yazılar, maddələr, kartlar və xatırladıcılar hesaba əlavə olunur; heç nə silinmir.
    mergeLocal() {
      const seed = this.localSeed(); if (!seed) return;
      const addMissing = (cur, extra) => [...cur, ...(extra || []).filter(x => x && !cur.some(c => c.id === x.id))];
      state.categories = addMissing(state.categories, seed.categories);
      state.reminders = addMissing(state.reminders, seed.reminders);
      if (Array.isArray(seed.cards)) state.cards = addMissing(state.cards, normCards(seed.cards));
      const have = new Set(state.records.map(r => r.id));
      const add = (seed.records || []).filter(r => !have.has(r.id));
      add.forEach(r => { const { id, ...body } = r; this.putRec(id, body).catch(() => {}); });
      this.saveMeta();
      try { localStorage.setItem(UPLOADED_KEY, this.user.uid); } catch (e) {}
      toast(`${add.length} əməliyyat hesaba əlavə edildi`);
    },
    // Ehtiyat nüsxədən bərpa: köhnə yazılar nüsxədəkilərlə əvəzlənir
    async replaceAll(d) {
      const old = state.records;
      state.categories = d.categories || DEFAULT_CATS.slice();
      state.records = d.records;
      state.reminders = d.reminders || [];
      state.done = d.done || {};
      state.plan = normPlan(d.plan);
      state.cards = normCards(d.cards, d.cardOpening);
      state.profile = d.profile || state.profile || {};
      state.catsVersion = d.catsVersion || 1;
      upgradeCats();
      if (this.mode === "local") { this.persistLocal(); render(); return; }
      render();
      const keep = new Set(d.records.map(r => r.id));
      old.filter(r => !keep.has(r.id)).forEach(r => this.recs.doc(r.id).delete().catch(() => {}));
      d.records.forEach(r => { const { id, ...body } = r; this.putRec(id, body).catch(() => {}); });
      this.saveMeta();
    },
    // Geri alma tarixçəsi: hər əməliyyatın əvvəlki halı yadda saxlanır (son 30)
    history: [],
    // Silkələmə yalnız ən son əməliyyatı geri alır: yeni əməliyyat olanda açılır, hər geri alındıqda bağlanır
    shakeArmed: false,
    pushHistory(entry) { this.history.push({ ...entry, t: Date.now() }); if (this.history.length > 30) this.history.shift(); this.shakeArmed = true; },
    async saveRecord(r, fromUndo) {
      const i = state.records.findIndex(x => x.id === r.id);
      if (!fromUndo) this.pushHistory({ kind: "save", id: r.id, prev: i >= 0 ? state.records[i] : null });
      if (i >= 0) state.records[i] = r; else state.records.push(r);
      render();
      if (this.mode === "local") return this.persistLocal();
      const { id, ...body } = r;
      try { await this.putRec(id, body); } catch (e) { toast(e?.code === "quota_exceeded" ? "Yaddaş limiti dolub." : "Yadda saxlamaq alınmadı. Yenidən cəhd edin."); }
    },
    async deleteRecord(id, fromUndo) {
      const prev = state.records.find(r => r.id === id);
      if (prev && !fromUndo) this.pushHistory({ kind: "delete", id, prev });
      state.records = state.records.filter(r => r.id !== id);
      render();
      if (this.mode === "local") return this.persistLocal();
      try { await this.recs.doc(id).delete(); } catch (e) { toast("Silmək alınmadı."); }
    },
    // Son əməliyyatı geri qaytarır: yeni yazı silinir, dəyişdirilən və silinən yazı əvvəlki halına qayıdır
    undo() {
      const h = this.history.pop(); if (!h) return false;
      this.shakeArmed = false;
      if (h.kind === "save" && !h.prev) this.deleteRecord(h.id, true);
      else this.saveRecord(h.prev, true);
      return true;
    },
    dropOldDefaults() {
      const keep = state.reminders.filter(r => OLD_DEFAULT_REMINDERS[r.id] !== r.title);
      const changed = keep.length !== state.reminders.length;
      state.reminders = keep;
      return changed;
    },
    // Kateqoriyalar, xatırladıcılar və "ödənildi" qeydləri bir sənəddə saxlanılır
    async saveMeta() {
      render();
      if (this.mode === "local") return this.persistLocal();
      const meta = { categories: state.categories, reminders: state.reminders, done: state.done, plan: state.plan, cards: state.cards, cardOpening: state.cards[0]?.opening || 0, profile: state.profile, catsVersion: state.catsVersion };
      // catsVersion şifrəsiz də qalır ki, köhnə versiya açılsa, boş məlumatı "yeniləyib" üstünə yazmasın
      try { await this.base.set(this.key ? { ...(await this.wrap(meta)), catsVersion: state.catsVersion } : meta); }
      catch (e) { toast("Yadda saxlamaq alınmadı. Yenidən cəhd edin."); }
    },
    saveCategories(cats) { state.categories = cats; return this.saveMeta(); },
    saveReminders(list) { state.reminders = list; return this.saveMeta(); },
    setDone(key, value) {
      const d = { ...state.done };
      if (value) d[key] = true; else delete d[key];
      state.done = d;
      return this.saveMeta();
    }
  };

  // ---------- Hesablamalar ----------
  const monthRecords = () => { const k = monthKey(state.month); return state.records.filter(r => r.date && r.date.startsWith(k)); };
  // Köhnə məlumata yeni standart gəlir maddələrini bir dəfə əlavə edir; true qaytarırsa dəyişiklik olub
  function upgradeCats() {
    if (state.catsVersion >= CATS_VERSION) return false;
    const cats = state.categories.map(c => c.id === "i6" && c.name === "ƏDV gerialı" ? { ...c, name: "ƏDV geri al" } : c);
    state.categories = [...cats, ...NEW_INCOME_CATS.filter(c => !cats.some(x => x.id === c.id))];
    state.catsVersion = CATS_VERSION;
    return true;
  }
  // Kartlar: köhnə məlumatda yalnız cardOpening var idi, o ilk karta ("card1") köçürülür
  function normCards(cards, cardOpening) {
    if (Array.isArray(cards) && cards.length) return cards.map(c => ({ id: String(c.id), name: String(c.name || "Kart"), limit: Number(c.limit) || 0, opening: Number(c.opening) || 0 }));
    return [{ id: "card1", name: "Taksit kartı", limit: 0, opening: Number(cardOpening) || 0 }];
  }
  const sum = list => list.reduce((a, r) => a + (Number(r.amount) || 0), 0);

  // ---------- Ekranlar ----------
  function render() {
    $("#monthLabel").textContent = `${MON_SHORT[state.month.getMonth()]} ${state.month.getFullYear()}`;
    $("#monthLabel").setAttribute("aria-label", `${MONTHS[state.month.getMonth()]} ${state.month.getFullYear()}, ay seçin`);
    $("#title").textContent = { summary: "Xülasə", records: "Əməliyyatlar", plan: "Plan", cats: "Kateqoriyalar" }[state.tab];
    $("#monthBox").hidden = state.tab === "cats";
    paintAvatar();
    document.querySelectorAll(".tabbar button").forEach(b => {
      if (b.dataset.tab === state.tab) b.setAttribute("aria-current", "page"); else b.removeAttribute("aria-current");
    });
    const view = $("#view");
    if (!state.ready) { view.innerHTML = `<div class="empty"><b>Yüklənir…</b>Xərc və gəlirləriniz açılır.</div>`; return; }
    view.innerHTML = state.tab === "summary" ? summaryView() : state.tab === "records" ? recordsView() : state.tab === "plan" ? planView() : catsView();
  }

  // ---------- Xatırladıcılar ----------
  const daysLabel = days => "Hər ay: " + days.slice().sort((a, b) => a - b).join(", ");
  // Seçilmiş ay üçün ödənişlər: hər xatırladıcı ayda bir ödənişdir, amma bir neçə gün xatırladıla bilər (məs. 1-i və 5-i)
  function occurrences(year, month) {
    const last = new Date(year, month + 1, 0).getDate();
    const today = ymd(new Date());
    const ym = `${year}-${pad(month + 1)}`;
    const list = [];
    state.reminders.forEach(r => {
      const dates = [...new Set((r.days || []).map(d => `${ym}-${pad(Math.min(d, last))}`))].sort();
      if (!dates.length) return;
      const key = `${r.id}|${ym}`;
      const done = !!state.done[key] || dates.some(d => state.done[`${r.id}|${d}`]);
      const next = dates.find(d => d >= today);
      const status = done ? "done" : dates.includes(today) ? "today" : !next ? "late" : "soon";
      list.push({ r, dates, date: next || dates[dates.length - 1], key, done, status });
    });
    return list.sort((a, b) => a.date.localeCompare(b.date) || a.r.title.localeCompare(b.r.title));
  }
  const daysOf = o => o.dates.map(d => Number(d.slice(8))).join(" və ");
  function statusPill(o) {
    if (o.status === "done") return `<span class="pill done">Ödənildi ✓</span>`;
    if (o.status === "late") return `<span class="pill late">Gecikib</span>`;
    if (o.status === "today") return `<span class="pill today">Bu gün</span>`;
    const days = Math.round((parseYmd(o.date) - parseYmd(ymd(new Date()))) / 86400000);
    return `<span class="pill soon">${days} gün qalıb</span>`;
  }
  // Xülasədə iki kiçik düymə: xatırladıcılar və hesabat
  function toolTiles() {
    const now = new Date();
    const due = occurrences(now.getFullYear(), now.getMonth()).filter(o => o.status === "today" || o.status === "late");
    const sub = due.length ? `${due.length} ödəniş gözləyir` : state.reminders.length ? "Gözləyən ödəniş yoxdur" : "Əlavə edin";
    return `<div class="tiles">
      <button class="tile ${due.length ? "warn" : ""}" data-openrem>
        <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 1 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg></span>
        <div><b>Ödənişlər</b><span class="s">${sub}</span></div>
      </button>
      <button class="tile" data-report>
        <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M3 15h18M9 3v18"/></svg></span>
        <div><b>Hesabat</b><span class="s">Aylar və maddələr</span></div>
      </button>
      <button class="tile wide" data-opencard>
        <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="5" width="19" height="14" rx="2.5"/><path d="M2.5 10h19M6.5 15h4"/></svg></span>
        <div><b>Taksit kartları</b><span class="s">${state.cards.length > 1 ? `${state.cards.length} kart · ` : ""}Borc: ${money(totalCardDebt())}</span></div>
      </button>
    </div>`;
  }

  // ---------- Taksit kartları ----------
  // Kartla edilən alış adi xərcdir (pay: "card", cardId) və bir dəfə sayılır.
  // Karta pul köçürmək xərc deyil (kind: "cardpay", cardId): yalnız həmin kartın borcunu azaldır.
  // cardId olmayan köhnə yazılar ilk karta ("card1") aiddir.
  const DEFAULT_CARD = "card1";
  const isCardExp = r => r.kind === "expense" && r.pay === "card";
  const cardIdOf = r => r.cardId || DEFAULT_CARD;
  const cardById = id => state.cards.find(c => c.id === id);
  const cardName = r => cardById(cardIdOf(r))?.name || "Taksit kartı";
  const cardRecs = id => state.records.filter(r => (isCardExp(r) || r.kind === "cardpay") && cardIdOf(r) === id);
  // Borc = tətbiqə qədərki ilkin borc + kartla xərclər − karta ödənişlər
  function cardDebt(id) {
    const c = cardById(id); if (!c) return 0;
    const recs = cardRecs(id);
    return c.opening + sum(recs.filter(isCardExp)) - sum(recs.filter(r => r.kind === "cardpay"));
  }
  const totalCardDebt = () => state.cards.reduce((a, c) => a + cardDebt(c.id), 0);
  const parseMoney = v => parseFloat(String(v ?? "").replace(/\s/g, "").replace(",", "."));
  const toInput = v => v ? String(v).replace(".", ",") : "";

  function openCardSheet() {
    sheet(`
      <div class="sheet-head">
        <button class="link" data-close>Bağla</button>
        <h2>Taksit kartları</h2>
        <span></span>
      </div>
      <div class="stack">
        <div class="list">${state.cards.map(c => {
          const debt = cardDebt(c.id), free = c.limit - debt;
          return `<button class="row" data-card="${esc(c.id)}">
            ${badge(c.name)}
            <span class="t"><div>${esc(c.name)}</div>
              <div class="sub">${c.limit > 0 ? `Limit ${money(c.limit)} · Boş ${money(free)}` : "Limit yazılmayıb"}</div>
              ${c.limit > 0 ? `<div class="track"><i style="width:${Math.min(100, Math.max(0, debt / c.limit * 100)).toFixed(1)}%"></i></div>` : ""}
            </span>
            <span class="amt num ${debt > 0 ? "bal-neg" : ""}">${money(debt)}</span>
          </button>`;
        }).join("")}</div>
        <button class="secondary" data-newcard>+ Yeni kart</button>
        <p class="note">Hər kartın qalan borcu sağda görünür. Kartla alış edəndə xərci adi qaydada yazın, "Taksit kartı" və kartı seçin. Karta pul köçürəndə kartın içindən "Karta ödəniş" əlavə edin.</p>
      </div>`);
    sheetHandler = e => {
      const t = e.target.closest("button"); if (!t) return;
      if (t.dataset.card) openCardDetail(t.dataset.card);
      else if (t.hasAttribute("data-newcard")) openCardEdit(null);
    };
  }

  function openCardDetail(id) {
    const c = cardById(id); if (!c) return openCardSheet();
    const m = state.month.getMonth();
    const list = monthRecords().filter(r => (isCardExp(r) || r.kind === "cardpay") && cardIdOf(r) === id)
      .sort((a, b) => b.date.localeCompare(a.date) || (b.created || 0) - (a.created || 0));
    const debt = cardDebt(id);
    sheet(`
      <div class="sheet-head">
        <button class="link" data-back>‹ Kartlar</button>
        <h2>${esc(c.name)}</h2>
        <button class="link save" data-editcard>Düzəlt</button>
      </div>
      <div class="stack">
        <section class="card balance">
          <p class="label">Qalan borc</p>
          <div class="big num ${debt > 0 ? "neg" : ""}">${money(debt)}</div>
          <div class="split">
            <div><small>Limit</small><b class="num">${c.limit > 0 ? money(c.limit) : "—"}</b></div>
            <div class="in"><small>Boş limit</small><b class="num">${c.limit > 0 ? money(c.limit - debt) : "—"}</b></div>
          </div>
          <div class="split" style="margin-top:10px">
            <div class="out"><small>${MONTHS[m]}: kartla xərc</small><b class="num">${money(sum(list.filter(isCardExp)))}</b></div>
            <div class="in"><small>${MONTHS[m]}: karta ödəniş</small><b class="num">${money(sum(list.filter(r => r.kind === "cardpay")))}</b></div>
          </div>
        </section>
        <button class="primary" data-newcardpay>+ Karta ödəniş</button>
        <div class="list">${list.map(rowHtml).join("") || `<div class="empty">Bu ay bu kartla əməliyyat yoxdur.</div>`}</div>
      </div>`);
    sheetHandler = e => {
      const t = e.target.closest("button"); if (!t) return;
      if (t.hasAttribute("data-back")) openCardSheet();
      else if (t.hasAttribute("data-editcard")) openCardEdit(id);
      else if (t.hasAttribute("data-newcardpay")) openCardPaySheet(null, id);
      else if (t.dataset.edit) {
        const r = state.records.find(x => x.id === t.dataset.edit);
        if (r) r.kind === "cardpay" ? openCardPaySheet(r) : openRecordSheet(r, null, null, () => openCardDetail(id));
      }
    };
  }

  // Kart əlavə etmək və ya dəyişmək. "Qalan borc" yazılanda fərq kartın ilkin borcuna düşür, köhnə yazılara toxunulmur.
  function openCardEdit(id) {
    const c = id ? cardById(id) : null;
    const cur = c ? cardDebt(id) : 0;
    const used = c ? cardRecs(id).length : 0;
    const f = { name: c?.name || "", limit: toInput(c?.limit), debt: c ? String(Math.round(cur * 100) / 100).replace(".", ",") : "" };
    let confirmDel = false;
    const draw = () => {
      sheet(`
        <div class="sheet-head">
          <button class="link" data-back>‹ Geri</button>
          <h2>${c ? "Kartı düzəlt" : "Yeni kart"}</h2>
          <button class="link save" data-save ${f.name.trim() ? "" : "disabled"}>Saxla</button>
        </div>
        <div class="stack">
          <label class="field"><span>Kartın adı</span><input id="c-name" class="input" value="${esc(f.name)}" placeholder="Məsələn: Leobank, Birbank" maxlength="30"></label>
          <label class="field"><span>Limit (₼)</span><input id="c-limit" class="input num" inputmode="decimal" value="${esc(f.limit)}" placeholder="0"></label>
          <label class="field"><span>Hazırda qalan borc (₼)</span><input id="c-debt" class="input num" inputmode="decimal" value="${esc(f.debt)}" placeholder="0"></label>
          <p class="note">Qalan borcu yazanda tətbiq fərqi kartın ilkin borcuna əlavə edir. Köhnə əməliyyatlar dəyişmir.</p>
          ${c && state.cards.length > 1 ? (used
            ? `<p class="note">Bu kartla ${used} əməliyyat var, ona görə kartı silmək olmaz.</p>`
            : `<button class="danger ${confirmDel ? "confirm" : ""}" data-del>${confirmDel ? "Silməyi təsdiqləyin" : "Kartı sil"}</button>`) : ""}
        </div>`);
      $("#c-name").addEventListener("input", e => { f.name = e.target.value; $("[data-save]").disabled = !f.name.trim(); });
      $("#c-limit").addEventListener("input", e => { f.limit = e.target.value; });
      $("#c-debt").addEventListener("input", e => { f.debt = e.target.value; });
    };
    sheetHandler = e => {
      const t = e.target.closest("button"); if (!t) return;
      if (t.hasAttribute("data-back")) c ? openCardDetail(id) : openCardSheet();
      else if (t.hasAttribute("data-del")) {
        if (!confirmDel) { confirmDel = true; draw(); return; }
        state.cards = state.cards.filter(x => x.id !== id);
        store.saveMeta(); toast("Kart silindi"); openCardSheet();
      }
      else if (t.hasAttribute("data-save")) {
        const name = f.name.trim(); if (!name) return;
        const limit = parseMoney(f.limit), debt = parseMoney(f.debt);
        if (f.limit.trim() && !Number.isFinite(limit)) { toast("Limiti düzgün yazın."); return; }
        if (f.debt.trim() && !Number.isFinite(debt)) { toast("Borcu düzgün yazın."); return; }
        const want = Number.isFinite(debt) ? debt : 0;
        const r2 = v => Math.round(v * 100) / 100;
        if (c) {
          state.cards = state.cards.map(x => x.id === id ? { ...x, name, limit: Number.isFinite(limit) ? r2(limit) : 0, opening: r2(x.opening + (want - cur)) } : x);
          store.saveMeta(); toast("Yadda saxlanıldı"); openCardDetail(id);
        } else {
          state.cards = [...state.cards, { id: "card-" + uid().slice(0, 10), name, limit: Number.isFinite(limit) ? r2(limit) : 0, opening: r2(want) }];
          store.saveMeta(); toast("Kart əlavə edildi"); openCardSheet();
        }
      }
    };
    draw();
  }
